<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Aprovação | Plassô</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#030712',
                            900: '#0b0f19',
                            850: '#111827',
                            800: '#1f2937'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-950 text-slate-100 font-sans antialiased p-10">
    <div class="max-w-4xl mx-auto space-y-8">
        <div class="flex justify-between items-center border-b border-dark-800 pb-5">
            <div>
                <h1 class="text-2xl font-bold text-white flex items-center gap-2"><i class="fa-solid fa-circle-check text-blue-500"></i> Central de Aprovação de Conteúdo</h1>
                <p id="portal-client-name" class="text-xs text-blue-400 font-mono mt-1">Carregando cliente...</p>
            </div>
            <div class="flex items-center gap-3 bg-dark-900 p-3 rounded-xl border border-dark-800">
                <div>
                    <label class="block text-[10px] text-slate-400 uppercase">Mês</label>
                    <select id="filter-month" class="bg-dark-950 border border-dark-800 rounded px-2 py-1 text-xs text-white">
                        <option value="10">Outubro (2026)</option>
                        <option value="11">Novembro (2026)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 uppercase">Semana</label>
                    <select id="filter-week" class="bg-dark-950 border border-dark-800 rounded px-2 py-1 text-xs text-white">
                        <option value="all">Todas as Semanas</option>
                        <option value="1">Semana 1</option>
                        <option value="2">Semana 2</option>
                        <option value="3">Semana 3</option>
                        <option value="4">Semana 4</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="approval-posts-list" class="space-y-6">
            <!-- Posts carregados dinamicamente -->
        </div>
    </div>

    <!-- Modal de Reprovação / Ajuste -->
    <div id="extRejectionModal" class="fixed inset-0 bg-dark-950/80 backdrop-blur-md hidden items-center justify-center z-50 p-4">
        <div class="bg-dark-900 border border-dark-800 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4 text-xs">
            <h3 class="font-bold text-amber-400 uppercase text-sm">Solicitar Ajuste / Reprovar</h3>
            <textarea id="ext-rejection-notes" rows="4" class="w-full bg-dark-950 border border-dark-800 rounded-xl p-3 text-white resize-none" placeholder="O que precisa ser alterado..."></textarea>
            <div class="flex justify-end gap-3">
                <button onclick="closeExtRejection()" class="text-slate-400">Cancelar</button>
                <button onclick="submitExtRejection()" class="bg-amber-600 hover:bg-amber-500 text-white px-5 py-2 rounded-xl font-semibold">Enviar Reprova</button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const clientId = urlParams.get('client');
        let clients = JSON.parse(localStorage.getItem('plasso_clients') || '[]');
        let currentClient = clients.find(c => c.id === clientId) || clients[0];

        if(currentClient) {
            document.getElementById('portal-client-name').innerText = "Cliente: " + currentClient.name;
        }

        function renderPortalPosts() {
            let tasks = JSON.parse(localStorage.getItem('plasso_tasks') || '[]');
            const container = document.getElementById('approval-posts-list');
            container.innerHTML = '';

            let filteredTasks = tasks; // Poderia filtrar por cliente se desejado

            if(filteredTasks.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-500 py-10">Nenhuma postagem pendente para aprovação.</p>';
                return;
            }

            filteredTasks.forEach(t => {
                container.innerHTML += `
                    <div class="bg-dark-900 border border-dark-800 rounded-2xl p-6 space-y-4">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-white text-base">${t.client}</h3>
                            <span class="text-xs text-blue-400 font-mono">${t.type} • ${t.date.split('-').reverse().join('/')}</span>
                        </div>
                        <p class="text-sm text-slate-300 bg-dark-950 p-4 rounded-xl border border-dark-800">${t.caption}</p>
                        <div class="bg-dark-950 p-4 rounded-xl border border-dark-800 flex justify-between items-center">
                            <span class="text-xs text-slate-400 font-mono"><i class="fa-brands fa-google-drive text-blue-400 mr-1"></i> Arquivo de Mídia</span>
                            <a href="${t.drive || '#'}" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-semibold"><i class="fa-solid fa-play mr-1"></i> Dar Play / Visualizar</a>
                        </div>
                        <div class="flex justify-end gap-3 pt-2">
                            <button onclick="approveTask('${t.id}')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-xl text-xs font-semibold"><i class="fa-solid fa-check mr-1"></i> Aprovar Post</button>
                            <button onclick="openExtRejection('${t.id}')" class="bg-amber-600 hover:bg-amber-500 text-white px-5 py-2.5 rounded-xl text-xs font-semibold"><i class="fa-solid fa-xmark mr-1"></i> Reprovar / Ajustar</button>
                        </div>
                    </div>
                `;
            });
        }

        let targetTaskId = null;
        function approveTask(id) {
            let tasks = JSON.parse(localStorage.getItem('plasso_tasks') || '[]');
            let t = tasks.find(task => task.id === id);
            if(t) {
                t.status = 'approved';
                t.isRejected = false;
                localStorage.setItem('plasso_tasks', JSON.stringify(tasks));
                alert('Postagem aprovada com sucesso!');
                renderPortalPosts();
            }
        }

        function openExtRejection(id) {
            targetTaskId = id;
            document.getElementById('extRejectionModal').classList.remove('hidden');
            document.getElementById('extRejectionModal').classList.add('flex');
        }

        function closeExtRejection() {
            document.getElementById('extRejectionModal').classList.add('hidden');
            document.getElementById('extRejectionModal').classList.remove('flex');
        }

        function submitExtRejection() {
            const notes = document.getElementById('ext-rejection-notes').value;
            let tasks = JSON.parse(localStorage.getItem('plasso_tasks') || '[]');
            let t = tasks.find(task => task.id === targetTaskId);
            if(t) {
                t.status = 'urgent';
                t.isRejected = true;
                t.notes = 'Reprovado pelo cliente: ' + notes;
                localStorage.setItem('plasso_tasks', JSON.stringify(tasks));
                alert('Reprova enviada com sucesso! Os ajustes foram encaminhados.');
                closeExtRejection();
                renderPortalPosts();
            }
        }

        renderPortalPosts();
    </script>
</body>
</html>
