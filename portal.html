<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Aprovação | Plassô</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#030712',
                            900: '#0b0f19',
                            850: '#111827',
                            800: '#1f2937'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
    </style>
</head>
<body class="bg-dark-950 text-slate-100 min-h-screen flex flex-col p-10 select-none">

    <div class="max-w-6xl mx-auto w-full space-y-6">
        <div class="flex justify-between items-center border-b border-dark-800 pb-5">
            <div>
                <h1 class="text-2xl font-bold text-white flex items-center gap-2"><i class="fa-solid fa-circle-check text-blue-500"></i> Central de Aprovação de Conteúdo</h1>
                <p id="portal-client-title" class="text-xs text-blue-400 font-mono mt-1">Carregando cliente...</p>
            </div>
            <div class="flex items-center gap-3 bg-dark-900 p-3 rounded-2xl border border-dark-800">
                <div>
                    <label class="block text-[10px] text-slate-400 uppercase font-mono">Filtrar Mês</label>
                    <select id="filter-month" onchange="renderCalendar()" class="bg-dark-950 border border-dark-800 rounded px-3 py-1.5 text-xs text-white font-mono cursor-pointer">
                        <option value="10">Outubro (2026)</option>
                        <option value="11">Novembro (2026)</option>
                        <option value="12">Dezembro (2026)</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="bg-dark-900 border border-dark-800 rounded-3xl p-8 shadow-2xl space-y-6">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-white uppercase tracking-wider flex items-center gap-2"><i class="fa-regular fa-calendar text-blue-400"></i> Calendário de Publicações</h3>
            </div>
            
            <div class="grid grid-cols-7 gap-3 text-center text-xs font-bold text-slate-400 uppercase font-mono pb-2 border-b border-dark-800">
                <div>Dom</div><div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
            </div>

            <div id="calendar-grid" class="grid grid-cols-7 gap-3"></div>
        </div>
    </div>

    <!-- Modal Popup Variável e Centralizado para os Cards do Dia -->
    <div id="dayPostsModal" class="fixed inset-0 bg-dark-950/85 backdrop-blur-md hidden items-center justify-center z-40 p-6">
        <div id="modal-box-wrapper" class="bg-dark-900 border border-dark-800 rounded-3xl p-8 shadow-2xl flex flex-col max-h-[90vh] transition-all duration-300">
            <div class="flex items-center justify-between pb-4 border-b border-dark-800 shrink-0">
                <div>
                    <h3 id="modal-day-title" class="text-lg font-bold text-white uppercase">Conteúdos do Dia</h3>
                </div>
                <button onclick="closeDayModal()" class="text-slate-400 hover:text-white p-2 rounded-xl bg-dark-800 transition cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <!-- Cards em Linha Horizontal Dinâmica -->
            <div id="modal-cards-container" class="py-6 flex gap-6 overflow-x-auto flex-1 items-center justify-center"></div>
        </div>
    </div>

    <!-- Modal de Reprovação -->
    <div id="rejectionModal" class="fixed inset-0 bg-dark-950/95 backdrop-blur-lg hidden items-center justify-center z-50 p-4">
        <div class="bg-dark-900 border border-amber-500/50 w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4 text-xs">
            <h3 class="font-bold text-amber-400 uppercase text-sm flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation"></i> Motivo da Reprova</h3>
            <textarea id="rejection-notes-input" rows="4" class="w-full bg-dark-950 border border-dark-800 rounded-xl p-3 text-white resize-none" placeholder="Descreva o que precisa ser alterado..."></textarea>
            <div class="flex justify-end gap-3 pt-2">
                <button onclick="closeRejectionModal()" class="text-slate-400 cursor-pointer">Cancelar</button>
                <button onclick="submitRejection()" class="bg-amber-600 hover:bg-amber-500 text-white px-5 py-2 rounded-xl font-semibold cursor-pointer">Enviar Recusa</button>
            </div>
        </div>
    </div>


    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const clientId = urlParams.get('client');
        let clients = JSON.parse(localStorage.getItem('plasso_clients') || '[]');
        let currentClient = clients.find(c => c.id === clientId) || clients[0];
        let tasks = JSON.parse(localStorage.getItem('plasso_tasks') || '[]');

        if(currentClient) {
            document.getElementById('portal-client-title').innerText = "Cliente: " + currentClient.name;
        }

        function getClientTasks() {
            if(!currentClient) return tasks;
            return tasks.filter(t => t.client && t.client.toLowerCase().includes(currentClient.name.toLowerCase()));
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            let clientTasks = getClientTasks();
            const selectedMonth = document.getElementById('filter-month').value;

            for (let i = 1; i <= 31; i++) {
                let dayStr = i < 10 ? '0' + i : '' + i;
                let dayTasks = clientTasks.filter(t => {
                    if(!t.date) return false;
                    let parts = t.date.split('-');
                    if(parts.length < 3) return false;
                    return parts[1] === selectedMonth && parts[2] === dayStr;
                });

                let hasContent = dayTasks.length > 0;
                let allApproved = hasContent && dayTasks.every(t => t.status === 'approved');
                let hasRejected = hasContent && dayTasks.some(t => t.isRejected);

                let cardClass = 'bg-dark-950/40 border-dark-800/50 text-slate-600 opacity-30 cursor-not-allowed';
                let badge = '';
                let statusLabel = '';

                if (hasContent) {
                    if (hasRejected) {
                        cardClass = 'bg-red-600/20 border-red-500/60 text-white font-bold cursor-pointer hover:bg-red-600/30 hover:border-red-400 shadow-lg';
                        badge = `<span class="bg-red-600 text-white text-[10px] font-mono px-2 py-0.5 rounded-full mt-2"><i class="fa-solid fa-xmark mr-1"></i> Recusado</span>`;
                        statusLabel = 'Ajuste Pendente';
                    } else if (allApproved) {
                        cardClass = 'bg-emerald-600/20 border-emerald-500/60 text-white font-bold cursor-pointer hover:bg-emerald-600/30 hover:border-emerald-400 shadow-lg';
                        badge = `<span class="bg-emerald-600 text-white text-[10px] font-mono px-2 py-0.5 rounded-full mt-2"><i class="fa-solid fa-check mr-1"></i> Aprovado</span>`;
                        statusLabel = 'Aprovado';
                    } else {
                        cardClass = 'bg-blue-600/20 border-blue-500/60 text-white font-bold cursor-pointer hover:bg-blue-600/30 hover:border-blue-400 shadow-lg';
                        badge = `<span class="bg-blue-600 text-white text-[10px] font-mono px-2 py-0.5 rounded-full mt-2">${dayTasks.length} Post(s)</span>`;
                        statusLabel = 'Revisar';
                    }
                }

                grid.innerHTML += `
                    <div onclick="${hasContent ? `openDayModal('${i}')` : ''}" class="h-32 border ${cardClass} rounded-2xl p-3 flex flex-col justify-between transition group">
                        <span class="text-sm font-mono">${i}</span>
                        <div class="flex flex-col items-center justify-center">${badge}</div>
                        <span class="text-[9px] text-slate-400 font-mono">${statusLabel}</span>
                    </div>
                `;
            }
        }

        let currentActiveDayNum = null;
        function openDayModal(dayNum) {
            currentActiveDayNum = dayNum;
            let dayStr = dayNum < 10 ? '0' + dayNum : '' + dayNum;
            let clientTasks = getClientTasks();
            const selectedMonth = document.getElementById('filter-month').value;

            let dayTasks = clientTasks.filter(t => {
                if(!t.date) return false;
                let parts = t.date.split('-');
                return parts[1] === selectedMonth && parts[2] === dayStr;
            });

            document.getElementById('modal-day-title').innerText = `Conteúdos para o dia ${dayNum}`;
            const container = document.getElementById('modal-cards-container');
            const wrapper = document.getElementById('modal-box-wrapper');
            container.innerHTML = '';

            // Ajustar largura do wrapper com base na quantidade de posts
            if (dayTasks.length === 1) {
                wrapper.style.maxWidth = '460px';
            } else {
                wrapper.style.maxWidth = '1100px';
            }

            dayTasks.forEach(t => {
                let isAlreadyApproved = t.status === 'approved';
                let isRejected = t.isRejected;
                
                let cardBorder = isRejected ? 'border-red-500/60 bg-red-950/30' : (isAlreadyApproved ? 'border-emerald-500/60 bg-emerald-950/30' : 'border-dark-800 bg-dark-950');

                let headline = t.headline || t.client || 'Headline';
                let formato = t.type || 'Carrossel';
                let dataPost = t.date ? t.date.split('-').reverse().join('/') : 'Não definida';
                let driveLink = t.drive || '';
                let legenda = t.caption || 'Sem legenda informada.';
                let notas = t.notes || 'Nenhuma observação ou link de referência.';

                let cardContentHTML = '';

                if (isAlreadyApproved) {
                    // Estado Aprovado: some informações, fica apenas ✅ e texto
                    cardContentHTML = `
                        <div class="flex flex-col items-center justify-center py-12 space-y-4 flex-1">
                            <span class="text-5xl">✅</span>
                            <h4 class="font-bold text-emerald-400 text-base uppercase tracking-wider">Post aprovado</h4>
                            <p class="text-xs text-slate-400 font-mono">Este conteúdo já foi aprovado e não pode ser alterado.</p>
                        </div>
                    `;
                } else if (isRejected) {
                    // Estado Reprovado: some informações, fica apenas ⚠️ e texto
                    cardContentHTML = `
                        <div class="flex flex-col items-center justify-center py-12 space-y-4 flex-1">
                            <span class="text-5xl">⚠️</span>
                            <h4 class="font-bold text-red-400 text-base uppercase tracking-wider">Post enviado para ajuste</h4>
                            <p class="text-xs text-slate-400 font-mono">${notas}</p>
                        </div>
                    `;
                } else {
                    // Estado Pendente: exibe todas as informações e botões
                    cardContentHTML = `
                        <div class="space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="bg-blue-950 text-blue-400 border border-blue-800/60 px-2.5 py-0.5 rounded-full text-[10px] font-mono uppercase font-bold">${formato}</span>
                                <span class="text-[10px] text-slate-400 font-mono"><i class="fa-regular fa-calendar mr-1"></i>${dataPost}</span>
                            </div>
                            
                            <div>
                                <span class="text-[10px] text-slate-400 font-mono uppercase">Headline:</span>
                                <input type="text" value="${headline}" onchange="updateTaskField('${t.id}', 'headline', this.value)" class="w-full bg-dark-900 border border-dark-800 rounded-xl px-3 py-2 text-white font-bold text-sm mt-0.5 focus:border-blue-500 outline-none">
                            </div>

                            <div>
                                <span class="text-[10px] text-slate-400 font-mono uppercase">Link do Drive:</span>
                                <div class="mt-0.5 flex gap-2">
                                    <input type="url" value="${driveLink}" onchange="updateTaskField('${t.id}', 'drive', this.value)" class="flex-1 bg-dark-900 border border-dark-800 rounded-xl px-3 py-1.5 text-xs text-blue-400 font-mono focus:border-blue-500 outline-none" placeholder="https://drive.google.com/...">
                                    <a href="${driveLink || '#'}" target="_blank" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center justify-center shrink-0 transition" title="Testar Link"><i class="fa-solid fa-play text-[10px]"></i></a>
                                </div>
                            </div>

                            <div>
                                <span class="text-[10px] text-slate-400 font-mono uppercase">Legenda:</span>
                                <p class="text-xs text-slate-300 bg-dark-900 p-3 rounded-xl border border-dark-800/60 leading-relaxed max-h-20 overflow-y-auto mt-0.5">${legenda}</p>
                            </div>

                            <div>
                                <span class="text-[10px] text-slate-400 font-mono uppercase">Notas / Referências:</span>
                                <p class="text-[11px] text-amber-300 bg-amber-950/30 p-2.5 rounded-xl border border-amber-800/50 mt-0.5">${notas}</p>
                            </div>
                        </div>

                        <div class="space-y-2 pt-2 border-t border-dark-800">
                            <div class="flex gap-2">
                                <button onclick="approveTask('${t.id}')" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-1.5 cursor-pointer"><i class="fa-solid fa-check"></i> Aprovar</button>
                                <button onclick="openRejectionModal('${t.id}')" class="flex-1 bg-amber-600 hover:bg-amber-500 text-white py-2.5 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-1.5 cursor-pointer"><i class="fa-solid fa-xmark"></i> Reprovar</button>
                            </div>
                            <button onclick="openPaymentModal('${t.date}')" class="w-full bg-dark-900 hover:bg-dark-800 border border-emerald-500/50 text-emerald-400 py-2.5 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-1.5 cursor-pointer shadow"><i class="fa-solid fa-wallet"></i> Lançar Pagamento</button>
                        </div>
                    `;
                }

                container.innerHTML += `
                    <div class="border ${cardBorder} rounded-2xl p-6 w-[380px] flex flex-col justify-between shrink-0 shadow-xl space-y-4" id="card-task-${t.id}">
                        ${cardContentHTML}
                    </div>
                `;
            });

            document.getElementById('dayPostsModal').classList.remove('hidden');
            document.getElementById('dayPostsModal').classList.add('flex');
        }

        function closeDayModal() {
            document.getElementById('dayPostsModal').classList.add('hidden');
            document.getElementById('dayPostsModal').classList.remove('flex');
            renderCalendar();
        }

        function updateTaskField(id, field, value) {
            let tasksList = JSON.parse(localStorage.getItem('plasso_tasks') || '[]');
            let t = tasksList.find(task => task.id === id);
            if(t) {
                t[field] = value;
                localStorage.setItem('plasso_tasks', JSON.stringify(tasksList));
                tasks = tasksList;
            }
        }

        function approveTask(id) {
            let tasksList = JSON.parse(localStorage.getItem('plasso_tasks') || '[]');
            let t = tasksList.find(task => task.id === id);
            if(t) {
                t.status = 'approved';
                t.isRejected = false;
                localStorage.setItem('plasso_tasks', JSON.stringify(tasksList));
                tasks = tasksList;
                alert('Conteúdo aprovado com sucesso!');
                openDayModal(parseInt(currentActiveDayNum));
                renderCalendar();
            }
        }

        let targetTaskIdForRejection = null;
        function openRejectionModal(id) {
            targetTaskIdForRejection = id;
            document.getElementById('rejection-notes-input').value = '';
            document.getElementById('rejectionModal').classList.remove('hidden');
            document.getElementById('rejectionModal').classList.add('flex');
        }

        function closeRejectionModal() {
            document.getElementById('rejectionModal').classList.add('hidden');
            document.getElementById('rejectionModal').classList.remove('flex');
        }

        function submitRejection() {
            const notes = document.getElementById('rejection-notes-input').value;
            if(!notes.trim()) {
                alert('Por favor, escreva o motivo da recusa.');
                return;
            }
            let tasksList = JSON.parse(localStorage.getItem('plasso_tasks') || '[]');
            let t = tasksList.find(task => task.id === targetTaskIdForRejection);
            if(t) {
                t.status = 'urgent';
                t.isRejected = true;
                t.notes = 'Reprovado pelo cliente: ' + notes;
                localStorage.setItem('plasso_tasks', JSON.stringify(tasksList));
                tasks = tasksList;
                alert('Recusa enviada com sucesso! O post retornou para ajuste.');
                closeRejectionModal();
                openDayModal(parseInt(currentActiveDayNum));
                renderCalendar();
    </script>
</body>
</html>
