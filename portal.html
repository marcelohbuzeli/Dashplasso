<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060918">
<title>Aprovação de conteúdos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/ui.css?v=4">
<style>
  .wrap { max-width: 860px; padding-bottom: calc(40px + var(--safe-b)); }
  .preview { white-space: pre-line; font-size: 14px; color: var(--ink-2); max-height: 7.5em; overflow: hidden; position: relative; }
  .preview.open { max-height: none; }
</style>
</head>
<body data-theme="empresa">
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="brand-mark">P</div><div><div class="brand-name">Plassô Marketing</div><div class="brand-sub">Aprovação de conteúdos</div></div></div>
  </header>

  <div class="hero">
    <div class="eyebrow">Olá,</div>
    <h1 class="display mt-2" id="cliente-nome"></h1>
    <p>Confira os conteúdos abaixo. Aprove ou peça ajuste. A agência recebe sua resposta na hora.</p>
  </div>

  <div class="grid g-2 md-g-4 mb-4" id="kpis"></div>
  <div class="seg mb-3" id="filtro"></div>
  <div id="lista" class="stack"></div>
  <p class="tiny muted center mt-8">Link exclusivo seu. Não compartilhe.</p>
</div>

<script src="assets/config.js?v=4"></script>
<script src="assets/core.js?v=5" data-mode="portal"></script>
<script src="assets/ui.js?v=4"></script>
<script type="text/plain" data-app>
  const { esc, T } = UI;
  const $ = id => document.getElementById(id);
  const cliente = DB.list('clients')[0] || { name: '' };
  $('cliente-nome').textContent = cliente.name;
  document.title = 'Aprovação · ' + cliente.name;
  let filtro = 'aprovar';

  const conteudos = () => DB.list('tasks').filter(t => T.isConteudo(t));
  const estado = t => (t.status === 'aprovadas' || t.status === 'approved') ? 'aprovado' : t.isRejected ? 'ajuste' : t.status === 'pronto' ? 'aprovar' : 'producao';
  const LABEL = { aprovar: 'Para aprovar', ajuste: 'Ajuste pedido', aprovado: 'Aprovados', producao: 'Em produção' };

  function render() {
    const all = conteudos();
    const cont = k => all.filter(t => estado(t) === k).length;
    $('kpis').innerHTML = ['aprovar', 'ajuste', 'aprovado', 'producao'].map(k => `<div class="card stat"><span class="label">${LABEL[k]}</span><span class="value">${cont(k)}</span></div>`).join('');
    if (filtro === 'aprovar' && !cont('aprovar')) filtro = 'todos';
    $('filtro').innerHTML = [['aprovar', 'Para aprovar'], ['ajuste', 'Ajustes'], ['aprovado', 'Aprovados'], ['todos', 'Todos']].map(([k, l]) => `<button data-f="${k}" class="${k === filtro ? 'on' : ''}">${l}<span class="count">${k === 'todos' ? all.length : cont(k)}</span></button>`).join('');
    $('filtro').querySelectorAll('button').forEach(b => b.onclick = () => { filtro = b.dataset.f; render(); });
    const arr = all.filter(t => filtro === 'todos' || estado(t) === filtro).sort((a, b) => (a.date || '9').localeCompare(b.date || '9'));
    $('lista').innerHTML = arr.map(t => {
      const e = estado(t);
      const pill = { aprovar: 'pill-accent', ajuste: 'pill-danger', aprovado: 'pill-ok', producao: '' }[e];
      const texto = [t.roteiro, t.legenda || t.caption].filter(Boolean).join('\n\n— Legenda —\n');
      return `<article class="card card-lg">
        <div class="row-between" style="align-items:flex-start"><div style="min-width:0"><div class="small muted">${esc(t.type || 'Conteúdo')}${t.date ? ' · ' + UI.dataBR(t.date) : ''}</div><h2 class="h2 mt-1">${esc(T.titulo(t))}</h2></div><span class="pill ${pill}" style="flex-shrink:0">${LABEL[e]}</span></div>
        ${texto ? `<div class="preview mt-3" data-prev>${esc(texto)}</div><button class="btn btn-ghost btn-sm mt-2" data-mais>Ver tudo</button>` : ''}
        ${e === 'ajuste' && t.notes ? `<div class="card card-tight mt-3 small" style="border-color:rgba(255,90,110,.4)"><b>Seu pedido:</b> ${esc(String(t.notes).replace(/^Reprovado pelo cliente:\s*/, ''))}</div>` : ''}
        <div class="wrap-row mt-4">
          ${t.drive ? `<a class="btn btn-ghost" href="${esc(t.drive)}" target="_blank" rel="noopener"><i class="fa-brands fa-google-drive"></i> Ver material</a>` : ''}
          ${e !== 'aprovado' ? `<button class="btn btn-white" data-ok="${esc(t.id)}"><i class="fa-solid fa-check"></i> Aprovar</button><button class="btn btn-ghost" data-adj="${esc(t.id)}"><i class="fa-solid fa-pen"></i> Pedir ajuste</button>` : '<span class="small muted"><i class="fa-solid fa-circle-check"></i> Aprovado</span>'}
        </div>
      </article>`;
    }).join('') || '<div class="card empty"><i class="fa-solid fa-mug-hot"></i>Nada por aqui no momento.</div>';
    $('lista').querySelectorAll('[data-mais]').forEach(b => b.onclick = () => { const p = b.previousElementSibling; p.classList.toggle('open'); b.textContent = p.classList.contains('open') ? 'Ver menos' : 'Ver tudo'; });
    $('lista').querySelectorAll('[data-ok]').forEach(b => b.onclick = () => aprovar(b.dataset.ok));
    $('lista').querySelectorAll('[data-adj]').forEach(b => b.onclick = () => ajuste(b.dataset.adj));
  }

  async function aprovar(id) {
    const t = DB.get('tasks', id); if (!t) return;
    t.status = 'aprovadas'; t.isRejected = false;
    DB.put('tasks', t); await DB.flush();
    render(); App.toast('Conteúdo aprovado. Obrigado!', 'ok');
  }
  function ajuste(id) {
    const t = DB.get('tasks', id); if (!t) return;
    const s = UI.sheet({ title: 'Pedir ajuste', html: `<p class="small soft">${esc(T.titulo(t))}</p><label class="field mt-3"><span>O que você quer mudar?</span><textarea class="textarea" id="m" rows="5" placeholder="Ex.: trocar a foto da capa, deixar o texto mais curto…"></textarea></label>`, foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-white" id="ok">Enviar pedido</button>' });
    s.$('#ok').onclick = async () => {
      const m = s.$('#m').value.trim(); if (!m) { App.toast('Escreva o que precisa mudar.', 'warn'); return; }
      t.status = 'urgent'; t.isRejected = true; t.notes = 'Reprovado pelo cliente: ' + m;
      DB.put('tasks', t); await DB.flush();
      s.close(); render(); App.toast('Pedido de ajuste enviado.', 'ok');
    };
  }
  render();
</script>
</body>
</html>
