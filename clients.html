<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060918">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Plassô | Clientes</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/ui.css?v=4">
</head>
<body data-theme="empresa">
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="brand-mark">P</div><div><div class="brand-name">Empresa</div><div class="brand-sub">Clientes</div></div></div>
    <div class="row"><button class="chip-btn" onclick="UI.menu()" aria-label="Menu"><i class="fa-solid fa-ellipsis"></i></button></div>
  </header>
  <nav id="subnav"></nav>

  <div class="row-between" style="align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:18px">
    <div>
      <div class="eyebrow" id="resumo"></div>
      <h1 class="display mt-2">Clientes</h1>
    </div>
    <div class="pair">
      <button class="btn btn-white" onclick="novoCliente()">Novo cliente</button>
      <button class="chip-btn accent" style="width:46px;height:46px" onclick="novoCliente()" aria-label="Novo cliente"><i class="fa-solid fa-plus"></i></button>
    </div>
  </div>

  <div class="row mb-3" style="flex-wrap:wrap">
    <div class="seg" id="f-status" style="flex:0 0 auto">
      <button data-s="ativo" class="on">Ativos</button><button data-s="encerrado">Encerrados</button><button data-s="todos">Todos</button>
    </div>
    <div class="grow" style="position:relative;min-width:200px">
      <i class="fa-solid fa-magnifying-glass muted" style="position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:13px"></i>
      <input class="input" id="busca" placeholder="Buscar cliente…" style="padding-left:40px">
    </div>
  </div>

  <div class="grid md-g-2 lg-g-3" id="grid"></div>
</div>

<script src="assets/config.js?v=4"></script>
<script src="assets/core.js?v=4" data-mode="app"></script>
<script src="assets/ui.js?v=4"></script>
<script src="assets/integracao.js?v=4"></script>
<script src="assets/financas.js?v=4"></script>
<script src="assets/empresa.js?v=4"></script>
<script type="text/plain" data-app>
  UI.mount({ tab: 'empresa', sub: 'clientes' });
  const { esc, T } = UI;
  const $ = id => document.getElementById(id);
  const mes = UI.hoje().slice(0, 7);
  let filtro = 'ativo', busca = '';

  const conteudosDe = c => T.conteudos().filter(t => (t.client || '').toLowerCase() === (c.name || '').toLowerCase());
  const recebimentosDe = c => DB.list('fin_lancamentos').filter(l => l.clienteId === c.id && l.tipo === 'entrada').sort((a, b) => a.data.localeCompare(b.data));

  function render() {
    const todos = DB.list('clients');
    const ativos = todos.filter(c => c.status !== 'encerrado');
    $('resumo').textContent = `${ativos.length} ativo${ativos.length !== 1 ? 's' : ''} · ${UI.brl(ativos.reduce((a, c) => a + (Number(c.fee) || 0), 0)).replace(',00', '')} por mês`;
    let arr = todos.filter(c => filtro === 'todos' || (filtro === 'encerrado' ? c.status === 'encerrado' : c.status !== 'encerrado'));
    if (busca) arr = arr.filter(c => (c.name + ' ' + (c.produto || '') + ' ' + (c.instagram || '')).toLowerCase().includes(busca));
    arr.sort((a, b) => a.name.localeCompare(b.name));
    $('grid').innerHTML = arr.map(c => {
      const ts = conteudosDe(c).filter(t => (t.date || '').startsWith(mes));
      const meta = Number(c.quantidadeMes) || ts.length;
      const feitos = ts.filter(t => ['aprovadas', 'pronto'].includes(T.status(t))).length;
      const pct = meta ? Math.min(100, Math.round(feitos * 100 / meta)) : 0;
      const prox = recebimentosDe(c).find(l => l.status === 'a_conferir');
      const atrasado = prox && prox.data < UI.hoje();
      return `<button class="card card-lg card-link" data-c="${esc(c.id)}" style="text-align:left;width:100%">
        <div class="row-between" style="align-items:flex-start">
          <div class="row" style="min-width:0"><div class="brand-mark" style="width:46px;height:46px;font-size:15px">${esc(UI.iniciais(c.name))}</div>
            <div style="min-width:0"><div class="h3 truncate">${esc(c.name)}</div><div class="small muted truncate">${esc(c.produto || 'Contrato sem produto')}</div></div></div>
          ${c.status === 'encerrado' ? '<span class="pill">Encerrado</span>' : atrasado ? '<span class="pill pill-danger">Pagamento atrasado</span>' : ''}
        </div>
        <div class="row-between mt-4"><span class="big-num" style="font-size:28px">${UI.brl(c.fee).replace(',00', '')}<span class="muted" style="font-size:14px;letter-spacing:0">/mês</span></span>
          <span class="small muted right">${prox ? 'próx. ' + UI.diaMes(prox.data) : (c.dueDate ? 'venc. ' + UI.diaMes(c.dueDate) : '')}</span></div>
        <div class="row-between small muted mt-4"><span>Conteúdos no mês</span><span class="num">${feitos}/${meta || '—'}</span></div>
        <div class="bar mt-2"><span style="width:${pct}%"></span></div>
      </button>`;
    }).join('') || `<div class="card empty md-span-2"><i class="fa-solid fa-user-group"></i>Nenhum cliente aqui.<br><button class="btn btn-white btn-sm mt-3" onclick="novoCliente()">Novo cliente</button></div>`;
    $('grid').querySelectorAll('[data-c]').forEach(b => b.onclick = () => abrirCliente(b.dataset.c));
  }

  function novoCliente() { Integracao.abrirConversao(null, r => { render(); abrirCliente(r.client.id); }); }

  function abrirCliente(id) {
    const c = DB.get('clients', id); if (!c) return;
    const ts = conteudosDe(c).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const doMes = ts.filter(t => (t.date || '').startsWith(mes));
    const recs = recebimentosDe(c);
    const temContrato = recs.length > 0;
    const s = UI.sheet({
      title: esc(c.name), wide: true,
      html: `
        <div class="seg mb-4" data-tabs><button data-t="contrato" class="on">Contrato</button><button data-t="conteudos">Conteúdos <span class="count">${doMes.length}</span></button><button data-t="financeiro">Pagamentos <span class="count">${recs.length}</span></button><button data-t="briefing">Briefing</button></div>

        <div data-p="contrato">
          ${c.status === 'encerrado' ? `<div class="card card-tight mb-3"><span class="small"><i class="fa-solid fa-ban"></i> Contrato encerrado em ${UI.dataBR(c.encerradoEm)}</span></div>` : ''}
          ${!temContrato ? `<div class="card card-tight card-accent mb-3 small">Este cliente ainda não tem recebimentos no Financeiro. Preencha valor, 1º vencimento e tempo de contrato e salve para gerar.</div>` : ''}
          <div class="form-grid">
            <label class="field full"><span>Nome</span><input class="input" name="name" value="${esc(c.name)}"></label>
            <label class="field full"><span>Produto</span><input class="input" name="produto" value="${esc(c.produto || '')}" placeholder="Ex.: Gestão de Redes — Pro"></label>
            <label class="field"><span>Valor mensal (R$)</span><input class="input" type="number" step="0.01" inputmode="decimal" name="fee" value="${esc(c.fee ?? '')}"></label>
            <label class="field"><span>Conteúdos por mês</span><input class="input" type="number" name="quantidadeMes" value="${esc(c.quantidadeMes ?? '')}"></label>
            <label class="field"><span>Data de entrada</span><input class="input" type="date" name="inicio" value="${esc(c.inicio || '')}"></label>
            <label class="field"><span>1º vencimento</span><input class="input" type="date" name="primeiroVencimento" value="${esc(c.primeiroVencimento || c.dueDate || '')}" ${temContrato ? 'disabled' : ''}></label>
            <label class="field"><span>Tempo de contrato (meses)</span><input class="input" type="number" min="1" name="contratoMeses" value="${esc(c.contratoMeses ?? '')}" ${temContrato ? 'disabled' : ''}></label>
            <label class="field"><span>WhatsApp</span><input class="input" inputmode="tel" name="whatsapp" value="${esc(c.whatsapp || '')}"></label>
            <label class="field"><span>Instagram</span><input class="input" name="instagram" value="${esc(c.instagram || '')}"></label>
            <label class="field"><span>E-mail</span><input class="input" type="email" name="email" value="${esc(c.email || '')}"></label>
            <label class="field full"><span>CPF / CNPJ</span><input class="input" name="documento" value="${esc(c.documento || '')}"></label>
          </div>
          ${temContrato ? '<p class="tiny muted mt-2">Vencimento e duração ficam travados porque os recebimentos já foram gerados. Para mudar, use Renovar ou Encerrar.</p>' : ''}
          <div class="divider"></div>
          <div class="eyebrow mb-2">Aprovação pelo cliente</div>
          <div class="wrap-row">
            <button class="btn btn-white btn-sm" data-act="whats"><i class="fa-brands fa-whatsapp"></i> Enviar link no WhatsApp</button>
            <button class="btn btn-ghost btn-sm" data-act="copiar"><i class="fa-solid fa-link"></i> Copiar link</button>
            <a class="btn btn-ghost btn-sm" href="${UI.keepParams('criacao.html?cliente=' + encodeURIComponent(c.id))}"><i class="fa-solid fa-wand-magic-sparkles"></i> Criar conteúdos (IA)</a>
          </div>
          <div class="divider"></div>
          <div class="eyebrow mb-2">Contrato</div>
          <div class="wrap-row">
            <button class="btn btn-ghost btn-sm" data-act="renovar"><i class="fa-solid fa-rotate"></i> Renovar</button>
            ${c.status !== 'encerrado' ? '<button class="btn btn-ghost btn-sm" data-act="encerrar"><i class="fa-solid fa-ban"></i> Encerrar contrato</button>' : ''}
            <button class="btn btn-danger btn-sm" data-act="excluir"><i class="fa-solid fa-trash"></i> Excluir cliente</button>
          </div>
        </div>

        <div data-p="conteudos" class="hidden">
          <div class="row-between mb-3"><span class="muted small">${UI.mesNome(mes)}</span><button class="btn btn-white btn-sm" data-act="novo-conteudo"><i class="fa-solid fa-plus"></i> Conteúdo</button></div>
          <div class="stack">${ts.slice(0, 40).map(t => Empresa.card(t, { showClient: false })).join('') || '<div class="empty">Nenhum conteúdo ainda.</div>'}</div>
        </div>

        <div data-p="financeiro" class="hidden">
          <div class="list">${recs.map(l => `<div class="item"><div class="icon ${l.status === 'pago' ? 'accent' : ''}"><i class="fa-solid ${l.status === 'pago' ? 'fa-check' : l.status === 'cancelado' ? 'fa-ban' : 'fa-clock'}"></i></div><div class="grow"><div class="title">${UI.dataBR(l.data)}</div><div class="sub">${l.parcela ? `Mês ${l.parcela}/${l.totalParcelas}` : ''}</div></div><div class="right"><div class="num">${UI.brl(l.valor)}</div><div class="tiny ${l.status === 'pago' ? '' : 'muted'}">${l.status === 'pago' ? 'recebido' : l.status === 'cancelado' ? 'cancelado' : (l.data < UI.hoje() ? 'atrasado' : 'a receber')}</div></div></div>`).join('') || '<div class="empty">Sem recebimentos. Preencha o contrato e salve.</div>'}</div>
          ${recs.length ? `<a class="btn btn-ghost btn-sm mt-3" href="${UI.keepParams('finance.html')}">Abrir Financeiro</a>` : ''}
        </div>

        <div data-p="briefing" class="hidden stack">
          <label class="field"><span>Objetivo principal</span><input class="input" name="objetivo" value="${esc(c.objetivo || '')}" placeholder="Ex.: gerar agendamentos"></label>
          <label class="field"><span>Briefing (o agente de criação usa este texto)</span><textarea class="textarea" name="briefing" rows="9" placeholder="Público, tom de voz, diferenciais, temas, o que evitar, referências…">${esc(c.briefing || '')}</textarea></label>
        </div>`,
      foot: '<button class="btn btn-ghost" data-close>Fechar</button><button class="btn btn-white" data-save>Salvar</button>'
    });
    s.$$('[data-t]').forEach(b => b.onclick = () => { s.$$('[data-t]').forEach(x => x.classList.toggle('on', x === b)); s.$$('[data-p]').forEach(p => p.classList.toggle('hidden', p.dataset.p !== b.dataset.t)); });
    s.$$('[data-task]').forEach(b => b.onclick = () => Empresa.abrir(b.dataset.task, () => { s.close(); render(); abrirCliente(id); }));

    s.$('[data-save]').onclick = () => {
      const f = UI.formData(s.el);
      if (!f.name.trim()) { App.toast('O nome é obrigatório.', 'warn'); return; }
      const atual = DB.get('clients', id);
      const nomeAntigo = atual.name;
      Object.assign(atual, { name: f.name.trim(), produto: f.produto.trim(), fee: Number(f.fee) || 0, quantidadeMes: Number(f.quantidadeMes) || 0, inicio: f.inicio, whatsapp: f.whatsapp.trim(), instagram: f.instagram.trim(), email: f.email.trim(), documento: f.documento.trim(), objetivo: f.objetivo.trim(), briefing: f.briefing });
      if (!temContrato) { atual.primeiroVencimento = f.primeiroVencimento; atual.dueDate = f.primeiroVencimento; atual.contratoMeses = Number(f.contratoMeses) || 0; }
      if (!atual.status) atual.status = 'ativo';
      DB.put('clients', atual);
      // renomeou: atualiza as tarefas do cliente
      if (nomeAntigo !== atual.name) {
        const alt = DB.list('tasks').filter(t => (t.client || '').toLowerCase() === nomeAntigo.toLowerCase());
        alt.forEach(t => t.client = atual.name);
        if (alt.length) DB.putMany('tasks', alt);
        const fins = DB.list('fin_lancamentos').filter(l => l.clienteId === atual.id && l.status !== 'pago');
        fins.forEach(l => { l.descricao = l.descricao.replace(nomeAntigo, atual.name); l.empresa = atual.name; });
        if (fins.length) DB.putMany('fin_lancamentos', fins);
      }
      let msg = 'Cliente salvo.';
      if (!temContrato && atual.fee && atual.primeiroVencimento && atual.contratoMeses) {
        const n = Integracao.gerarRecebimentos(atual).length;
        msg = `Cliente salvo · ${n} recebimentos lançados no Financeiro.`;
      }
      s.close(); render(); App.toast(msg, 'ok');
    };
    const act = (name, fn) => { const b = s.$(`[data-act="${name}"]`); if (b) b.onclick = fn; };
    act('copiar', async () => { Integracao.ensurePortalToken(c); const url = Integracao.portalUrl(DB.get('clients', id)); try { await navigator.clipboard.writeText(url); App.toast('Link de aprovação copiado.', 'ok'); } catch (e) { prompt('Copie o link:', url); } });
    act('whats', () => {
      const atual = DB.get('clients', id); Integracao.ensurePortalToken(atual);
      const w = s.$('[name=whatsapp]').value.trim();
      if (!w) { App.toast('Preencha o WhatsApp do cliente primeiro.', 'warn'); s.$('[name=whatsapp]').focus(); return; }
      if (w !== atual.whatsapp) { atual.whatsapp = w; DB.put('clients', atual); }
      const texto = `Olá, ${atual.name}! Seus conteúdos estão prontos para aprovação 🎬\n\nÉ só abrir o link, conferir e aprovar (ou pedir ajuste):\n${Integracao.portalUrl(atual)}`;
      window.open(Integracao.whatsappLink(atual, texto), '_blank');
    });
    act('novo-conteudo', () => Empresa.editarConteudo(null, { client: c.name }, () => { s.close(); render(); abrirCliente(id); }));
    act('renovar', () => {
      const r = UI.sheet({ title: 'Renovar contrato', html: '<label class="field"><span>Por quantos meses?</span><input class="input" type="number" min="1" id="m" value="6"></label><p class="muted small mt-2">Os novos recebimentos entram no Financeiro depois do último já lançado.</p>', foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-white" id="ok">Renovar</button>' });
      r.$('#ok').onclick = () => { const m = parseInt(r.$('#m').value, 10); if (!m || m < 1) return; const atual = DB.get('clients', id); if (!atual.primeiroVencimento) atual.primeiroVencimento = atual.dueDate || UI.hoje(); DB.put('clients', atual); const n = Integracao.renovarContrato(id, m); r.close(); s.close(); render(); App.toast(`Contrato renovado: ${n} novos recebimentos.`, 'ok'); };
    });
    act('encerrar', () => {
      const r = UI.sheet({ title: 'Encerrar contrato', html: `<label class="field"><span>Encerrar a partir de</span><input class="input" type="date" id="d" value="${UI.hoje()}"></label><p class="muted small mt-2">Os recebimentos ainda não confirmados a partir desta data são cancelados no Financeiro.</p>`, foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-danger" id="ok">Encerrar</button>' });
      r.$('#ok').onclick = () => { const d = r.$('#d').value; if (!d) return; const n = Integracao.encerrarCliente(id, d); r.close(); s.close(); render(); App.toast(`Contrato encerrado. ${n} recebimentos cancelados.`, 'ok'); };
    });
    act('excluir', () => {
      const r = UI.sheet({ title: 'Excluir cliente', html: `<p class="small soft">Isso apaga o cadastro de <b>${esc(c.name)}</b>. Conteúdos e lançamentos financeiros continuam guardados. Para confirmar, digite o nome do cliente:</p><input class="input mt-3" id="n" autocomplete="off">`, foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-danger" id="ok">Excluir</button>' });
      r.$('#ok').onclick = () => { if (r.$('#n').value.trim().toLowerCase() !== c.name.trim().toLowerCase()) { App.toast('O nome não confere.', 'warn'); return; } DB.remove('clients', id); r.close(); s.close(); render(); App.toast('Cliente excluído.', 'ok'); };
    });
  }

  document.querySelectorAll('#f-status button').forEach(b => b.onclick = () => { filtro = b.dataset.s; document.querySelectorAll('#f-status button').forEach(x => x.classList.toggle('on', x === b)); render(); });
  $('busca').addEventListener('input', e => { busca = e.target.value.toLowerCase().trim(); render(); });
  render();
  const qp = new URLSearchParams(location.search);
  if (qp.get('c')) abrirCliente(qp.get('c'));
  if (qp.get('novo')) novoCliente();
</script>
</body>
</html>
