<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plassô Marketing — Gestão</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#030712',
                            900: '#0b0f19',
                            850: '#111827',
                            800: '#1f2937'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .kanban-col { min-height: calc(100vh - 200px); }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #374151; }
    </style>
</head>
<body class="bg-dark-950 text-slate-200 antialiased overflow-hidden selection:bg-blue-600 selection:text-white">

    <div class="flex h-screen w-screen">
        
        <!-- BARRA LATERAL (TECH MINIMAL) -->
        <aside id="sidebar" class="bg-dark-900 border-r border-dark-800 flex flex-col justify-between transition-all duration-300 w-64 z-20 overflow-hidden">
            <div>
                <!-- Topo da Barra Lateral: Logo e Botão Tech -->
                <div class="h-20 flex items-center justify-between px-5 border-b border-dark-800/60 shrink-0">
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center font-bold text-white text-base shadow-inner shrink-0 tracking-wider">
                            P
                        </div>
                        <div class="sidebar-text truncate transition-opacity duration-200">
                            <span class="font-bold text-sm tracking-widest text-white uppercase">Plassô</span>
                            <span class="text-[10px] block text-blue-400 font-mono tracking-wider">SYSTEM v1.0</span>
                        </div>
                    </div>
                    <button id="toggle-btn" class="text-slate-400 hover:text-white p-2 rounded-lg hover:bg-dark-800 transition shrink-0">
                        <i class="fa-solid fa-chevron-left text-xs"></i>
                    </button>
                </div>

                <!-- Menu de Navegação -->
                <nav class="p-3 space-y-1.5 font-medium text-xs">
                    <a href="#" class="flex items-center gap-3 px-3.5 py-3 rounded-xl bg-dark-800/80 border border-slate-700/50 text-white shadow-sm transition group">
                        <i class="fa-solid fa-terminal text-blue-400 w-5 text-center text-sm shrink-0"></i>
                        <span class="sidebar-text tracking-wide whitespace-nowrap transition-opacity duration-200">Kanban Hub</span>
                    </a>
                    <a href="#" class="flex items-center gap-3 px-3.5 py-3 rounded-xl text-slate-400 hover:text-slate-200 hover:bg-dark-800/40 transition group">
                        <i class="fa-solid fa-network-wired text-slate-500 group-hover:text-slate-300 w-5 text-center text-sm shrink-0"></i>
                        <span class="sidebar-text tracking-wide whitespace-nowrap transition-opacity duration-200">Clientes</span>
                    </a>
                    <a href="#" class="flex items-center gap-3 px-3.5 py-3 rounded-xl text-slate-400 hover:text-slate-200 hover:bg-dark-800/40 transition group">
                        <i class="fa-solid fa-calendar-days text-slate-500 group-hover:text-slate-300 w-5 text-center text-sm shrink-0"></i>
                        <span class="sidebar-text tracking-wide whitespace-nowrap transition-opacity duration-200">Calendário</span>
                    </a>
                    <a href="#" class="flex items-center gap-3 px-3.5 py-3 rounded-xl text-slate-400 hover:text-slate-200 hover:bg-dark-800/40 transition group">
                        <i class="fa-solid fa-chart-line text-slate-500 group-hover:text-slate-300 w-5 text-center text-sm shrink-0"></i>
                        <span class="sidebar-text tracking-wide whitespace-nowrap transition-opacity duration-200">Métricas</span>
                    </a>
                </nav>
            </div>

            <!-- Rodapé da Sidebar -->
            <div class="p-4 border-t border-dark-800/60 shrink-0">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-lg bg-dark-800 border border-slate-700/50 flex items-center justify-center text-xs font-bold text-blue-400 shrink-0 font-mono">
                        MB
                    </div>
                    <div class="sidebar-text overflow-hidden font-mono transition-opacity duration-200">
                        <p class="text-xs font-semibold text-slate-200 truncate">Marcelo Buzeli</p>
                        <p class="text-[10px] text-emerald-400 flex items-center gap-1.5 mt-0.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> Online
                        </p>
                    </div>
                </div>
            </div>
        </aside>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden bg-dark-950">
            
            <!-- Topbar Minimalista -->
            <header class="h-20 border-b border-dark-800/60 px-8 flex items-center justify-between bg-dark-900/30 backdrop-blur-md shrink-0">
                <div>
                    <h1 class="text-base font-bold text-white tracking-wide flex items-center gap-2">
                        <i class="fa-solid fa-code-branch text-blue-500 text-xs"></i> Fluxo Operacional
                    </h1>
                    <p class="text-[11px] text-slate-400 font-mono mt-0.5">/workspace/plasso/publicacoes</p>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 shadow-lg shadow-blue-600/10 transition">
                        <i class="fa-solid fa-plus text-[10px]"></i> Nova Publicação
                    </button>
                </div>
            </header>

            <!-- Área do Kanban Tech -->
            <div class="flex-1 overflow-x-auto p-8">
                <div class="flex gap-5 h-full min-w-[1100px]">
                    
                    <!-- Coluna: A Fazer -->
                    <div class="flex-1 bg-dark-900/50 border border-dark-800/80 rounded-2xl flex flex-col max-h-full">
                        <div class="p-4 border-b border-dark-800/60 flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="w-2 h-2 rounded-full bg-amber-400"></div>
                                <h3 class="font-semibold text-slate-200 text-xs tracking-wider uppercase">A Fazer</h3>
                            </div>
                            <span id="count-todo" class="text-[10px] font-mono bg-dark-800 text-slate-400 px-2 py-0.5 rounded-md border border-slate-700/40">0</span>
                        </div>
                        <div id="col-todo" class="p-3.5 flex-1 overflow-y-auto space-y-3 kanban-col" ondragover="allowDrop(event)" ondrop="drop(event, 'todo')"></div>
                    </div>

                    <!-- Coluna: Fazendo -->
                    <div class="flex-1 bg-dark-900/50 border border-dark-800/80 rounded-2xl flex flex-col max-h-full">
                        <div class="p-4 border-b border-dark-800/60 flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="w-2 h-2 rounded-full bg-blue-400"></div>
                                <h3 class="font-semibold text-slate-200 text-xs tracking-wider uppercase">Fazendo</h3>
                            </div>
                            <span id="count-doing" class="text-[10px] font-mono bg-dark-800 text-slate-400 px-2 py-0.5 rounded-md border border-slate-700/40">0</span>
                        </div>
                        <div id="col-doing" class="p-3.5 flex-1 overflow-y-auto space-y-3 kanban-col" ondragover="allowDrop(event)" ondrop="drop(event, 'doing')"></div>
                    </div>

                    <!-- Coluna: Pronto -->
                    <div class="flex-1 bg-dark-900/50 border border-dark-800/80 rounded-2xl flex flex-col max-h-full">
                        <div class="p-4 border-b border-dark-800/60 flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="w-2 h-2 rounded-full bg-emerald-400"></div>
                                <h3 class="font-semibold text-slate-200 text-xs tracking-wider uppercase">Pronto</h3>
                            </div>
                            <span id="count-done" class="text-[10px] font-mono bg-dark-800 text-slate-400 px-2 py-0.5 rounded-md border border-slate-700/40">0</span>
                        </div>
                        <div id="col-done" class="p-3.5 flex-1 overflow-y-auto space-y-3 kanban-col" ondragover="allowDrop(event)" ondrop="drop(event, 'done')"></div>
                    </div>

                    <!-- Coluna: Aguardando -->
                    <div class="flex-1 bg-dark-900/50 border border-dark-800/80 rounded-2xl flex flex-col max-h-full">
                        <div class="p-4 border-b border-dark-800/60 flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <div class="w-2 h-2 rounded-full bg-indigo-400"></div>
                                <h3 class="font-semibold text-slate-200 text-xs tracking-wider uppercase">Aguardando</h3>
                            </div>
                            <span id="count-waiting" class="text-[10px] font-mono bg-dark-800 text-slate-400 px-2 py-0.5 rounded-md border border-slate-700/40">0</span>
                        </div>
                        <div id="col-waiting" class="p-3.5 flex-1 overflow-y-auto space-y-3 kanban-col" ondragover="allowDrop(event)" ondrop="drop(event, 'waiting')"></div>
                    </div>

                </div>
            </div>

        </main>
    </div>

    <!-- Modal Tech Nova Publicação -->
    <div id="postModal" class="fixed inset-0 bg-dark-950/80 backdrop-blur-md hidden items-center justify-center z-50 p-4">
        <div class="bg-dark-900 border border-dark-800 w-full max-w-md rounded-2xl p-6 shadow-2xl">
            <div class="flex items-center justify-between mb-5 border-b border-dark-800 pb-3">
                <h3 class="text-sm font-bold text-white tracking-wide uppercase flex items-center gap-2">
                    <i class="fa-solid fa-plus text-blue-500 text-xs"></i> Nova Publicação
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="postForm" onsubmit="addPost(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block font-semibold text-slate-400 mb-1.5 uppercase tracking-wider text-[10px]">Cliente</label>
                    <input type="text" id="clientName" required class="w-full bg-dark-950 border border-dark-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-blue-500 transition font-sans" placeholder="Ex: Rosa Pink Lingerie">
                </div>
                <div>
                    <label class="block font-semibold text-slate-400 mb-1.5 uppercase tracking-wider text-[10px]">Formato de Mídia</label>
                    <select id="postType" class="w-full bg-dark-950 border border-dark-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-blue-500 transition">
                        <option value="Reels">Reels</option>
                        <option value="Carrossel">Carrossel</option>
                        <option value="Story">Story</option>
                        <option value="Foto Única">Foto Única</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold text-slate-400 mb-1.5 uppercase tracking-wider text-[10px]">Legenda / Descrição</label>
                    <textarea id="postCaption" rows="3" required class="w-full bg-dark-950 border border-dark-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-blue-500 transition resize-none" placeholder="Detalhes da postagem..."></textarea>
                </div>
                <div>
                    <label class="block font-semibold text-slate-400 mb-1.5 uppercase tracking-wider text-[10px]">Data Alvo</label>
                    <input type="date" id="postDate" required class="w-full bg-dark-950 border border-dark-800 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-blue-500 transition font-mono">
                </div>
                <div class="flex justify-end gap-3 pt-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl font-semibold text-slate-400 hover:text-white transition">Cancelar</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl font-semibold shadow-lg shadow-blue-600/15 transition">Salvar Registro</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Sidebar collapse control
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggle-btn');
        const sidebarTexts = document.querySelectorAll('.sidebar-text');
        let isCollapsed = false;

        toggleBtn.addEventListener('click', () => {
            isCollapsed = !isCollapsed;
            if (isCollapsed) {
                sidebar.style.width = '76px';
                sidebarTexts.forEach(el => {
                    el.style.opacity = '0';
                    el.style.width = '0';
                    el.style.overflow = 'hidden';
                });
                toggleBtn.innerHTML = '<i class="fa-solid fa-chevron-right text-xs"></i>';
            } else {
                sidebar.style.width = '256px';
                sidebarTexts.forEach(el => {
                    el.style.opacity = '1';
                    el.style.width = 'auto';
                    el.style.overflow = 'visible';
                });
                toggleBtn.innerHTML = '<i class="fa-solid fa-chevron-left text-xs"></i>';
            }
        });

        // Mock Data
        let posts = [
            { id: '1', client: 'Rosa Pink Lingerie', type: 'Reels', caption: 'Lançamento nova coleção cápsula outono/inverno.', date: '2026-10-30', status: 'todo' },
            { id: '2', client: 'Umuclean', type: 'Carrossel', caption: 'Antes e depois higienização impermeabilizada.', date: '2026-10-28', status: 'doing' },
            { id: '3', client: 'Cardoso Cafeteria', type: 'Story', caption: 'Bastidores café especial da manhã.', date: '2026-10-27', status: 'done' },
            { id: '4', client: 'Dra. Carla Harmonização', type: 'Reels', caption: 'Mitos e verdades preenchimento labial.', date: '2026-11-02', status: 'waiting' }
        ];

        function renderKanban() {
            const columns = {
                todo: document.getElementById('col-todo'),
                doing: document.getElementById('col-doing'),
                done: document.getElementById('col-done'),
                waiting: document.getElementById('col-waiting')
            };

            const counts = { todo: 0, doing: 0, done: 0, waiting: 0 };
            Object.values(columns).forEach(col => col.innerHTML = '');

            posts.forEach(post => {
                counts[post.status]++;
                const card = document.createElement('div');
                card.className = 'bg-dark-950 border border-dark-800 hover:border-slate-700/70 rounded-xl p-3.5 cursor-grab active:cursor-grabbing shadow-sm transition group';
                card.draggable = true;
                card.ondragstart = (e) => e.dataTransfer.setData('text/plain', post.id);

                let badgeColor = 'bg-blue-950/60 text-blue-400 border-blue-900/50';
                if (post.type === 'Carrossel') badgeColor = 'bg-purple-950/60 text-purple-400 border-purple-900/50';
                if (post.type === 'Story') badgeColor = 'bg-amber-950/60 text-amber-400 border-amber-900/50';

                card.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-[11px] font-bold text-white tracking-wide">${post.client}</span>
                        <button onclick="deletePost('${post.id}')" class="text-slate-600 hover:text-red-400 transition opacity-0 group-hover:opacity-100"><i class="fa-solid fa-trash text-[10px]"></i></button>
                    </div>
                    <p class="text-[11px] text-slate-400 mb-3 line-clamp-2 leading-relaxed">${post.caption}</p>
                    <div class="flex items-center justify-between pt-2.5 border-t border-dark-800/60">
                        <span class="text-[9px] px-2 py-0.5 rounded border ${badgeColor} font-mono font-semibold">${post.type}</span>
                        <div class="flex items-center gap-1 text-[10px] text-slate-400 font-mono">
                            <i class="fa-regular fa-calendar text-[9px]"></i>
                            <span>${post.date.split('-').reverse().join('/')}</span>
                        </div>
                    </div>
                `;
                columns[post.status].appendChild(card);
            });

            document.getElementById('count-todo').innerText = counts.todo;
            document.getElementById('count-doing').innerText = counts.doing;
            document.getElementById('count-done').innerText = counts.done;
            document.getElementById('count-waiting').innerText = counts.waiting;
        }

        function allowDrop(ev) { ev.preventDefault(); }
        function drop(ev, newStatus) {
            ev.preventDefault();
            const postId = ev.dataTransfer.getData('text/plain');
            const post = posts.find(p => p.id === postId);
            if (post) { post.status = newStatus; renderKanban(); }
        }

        function openModal() {
            document.getElementById('postModal').classList.remove('hidden');
            document.getElementById('postModal').classList.add('flex');
            document.getElementById('postDate').valueAsDate = new Date();
        }

        function closeModal() {
            document.getElementById('postModal').classList.add('hidden');
            document.getElementById('postModal').classList.remove('flex');
            document.getElementById('postForm').reset();
        }

        function addPost(e) {
            e.preventDefault();
            const newPost = {
                id: Date.now().toString(),
                client: document.getElementById('clientName').value,
                type: document.getElementById('postType').value,
                caption: document.getElementById('postCaption').value,
                date: document.getElementById('postDate').value,
                status: 'todo'
            };
            posts.push(newPost);
            renderKanban();
            closeModal();
        }

        function deletePost(id) {
            posts = posts.filter(p => p.id !== id);
            renderKanban();
        }

        renderKanban();
    </script>
</body>
</html>
