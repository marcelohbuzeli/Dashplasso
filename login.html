<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#100a07">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Plassô">
  <title>Plassô | Entrar</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/ui.css?v=8">
  <style>
    .login { min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; max-width: 440px; margin: 0 auto; padding: calc(24px + var(--safe-t)) 20px calc(24px + var(--safe-b)); }
    .msg-ok { border-color: rgba(62,230,160,.4); color: #8ff3c8; }
    .msg-err { border-color: rgba(255,90,110,.45); color: #ff9aa7; }
  </style>
</head>
<body data-theme="home">
  <main class="login stack-lg">
    <div class="brand"><div class="brand-mark">P</div><div><div class="brand-name">Plassô</div><div class="brand-sub">Acesso privado</div></div></div>
    <div>
      <h1 class="display">Bem-vindo<br><span class="soft">de volta</span></h1>
      <p class="soft mt-3">Entre com seu e-mail e senha.</p>
    </div>
    <div id="msg" class="hidden"></div>

    <form id="f-login" class="stack">
      <label class="field"><span>E-mail</span><input class="input" id="email" type="email" autocomplete="username" inputmode="email" required></label>
      <label class="field"><span>Senha</span><input class="input" id="pass" type="password" autocomplete="current-password"></label>
      <div class="pair mt-2" style="width:100%">
        <button id="btn" class="btn btn-white btn-lg">Entrar</button>
        <button type="submit" class="chip-btn accent" style="width:54px;height:54px" aria-label="Entrar"><i class="fa-solid fa-arrow-right"></i></button>
      </div>
      <div class="row" style="justify-content:flex-end"><button type="button" id="btn-reset" class="btn btn-ghost btn-sm">Esqueci a senha</button></div>
    </form>

    <form id="f-codigo" class="hidden stack">
      <h2 class="h2">Confira seu e-mail</h2>
      <p class="small soft" id="cod-info"></p>
      <label class="field"><span>Código de 6 dígitos</span><input class="input" id="codigo" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="000000" style="letter-spacing:.3em;font-size:22px"></label>
      <label class="field"><span>Nova senha (mínimo 8 caracteres)</span><input class="input" id="cnova" type="password" autocomplete="new-password" minlength="8"></label>
      <label class="field"><span>Repita a senha</span><input class="input" id="cnova2" type="password" autocomplete="new-password" minlength="8"></label>
      <button class="btn btn-white btn-lg btn-block">Confirmar e entrar</button>
      <button type="button" class="btn btn-ghost btn-sm" id="cod-voltar">Voltar</button>
    </form>

    <form id="f-senha" class="hidden stack">
      <h2 class="h2">Crie sua senha de acesso</h2>
      <p class="small muted" id="senha-email"></p>
      <label class="field"><span>Nova senha (mínimo 8 caracteres)</span><input class="input" id="nova" type="password" autocomplete="new-password" minlength="8" required></label>
      <label class="field"><span>Repita a senha</span><input class="input" id="nova2" type="password" autocomplete="new-password" minlength="8" required></label>
      <button class="btn btn-white btn-lg btn-block">Salvar senha e entrar</button>
      <p class="tiny muted">Dica: quando o navegador perguntar "Salvar senha?", toque em Salvar.</p>
    </form>

    <p class="tiny muted center"><i class="fa-solid fa-lock"></i> Dados protegidos por login e regras de acesso no banco.</p>
  </main>

  <script src="assets/config.js?v=8"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
  <script>
    const cfg = window.PLASSO_CONFIG || {};
    const $ = id => document.getElementById(id);
    const show = (t, ok) => { $('msg').textContent = t; $('msg').className = 'card card-tight small ' + (ok ? 'msg-ok' : 'msg-err'); };
    const next = new URLSearchParams(location.search).get('next') || 'index.html';
    const safeNext = /^[a-z0-9_-]+\.html(\?.*)?$/i.test(next) ? next : 'index.html';
    const here = location.href.split('#')[0].split('?')[0];
    const linkType = (location.hash.match(/type=([a-z_]+)/) || [])[1];
    let linkErro = null;
    if (/error_description=|error_code=/.test(location.hash)) {
      linkErro = (location.hash.match(/error_code=([a-z_]+)/) || [])[1] || 'erro';
      history.replaceState(null, '', location.pathname + location.search); // não deixa o link inválido derrubar a sessão
    }
    const traduz = err => {
      const c = (err && (err.code || err.error_code)) || '';
      const m = (err && err.message) || '';
      if (c === 'over_email_send_rate_limit' || /rate limit/i.test(m)) return 'Limite de e-mails atingido (o plano grátis envia só 2 por hora). Entre com seu e-mail e senha, ou tente de novo daqui a 1 hora.';
      if (c === 'invalid_credentials' || /Invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
      if (/after \d+ seconds/i.test(m)) return 'Aguarde 1 minuto antes de pedir outro e-mail.';
      return m || 'Algo deu errado. Tente novamente.';
    };

    if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) {
      show('Banco ainda não configurado (assets/config.js). O sistema funciona em modo local.', false);
      $('f-login').onsubmit = e => { e.preventDefault(); location.href = safeNext; };
      $('btn').textContent = 'Continuar em modo local';
    } else {
      const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { detectSessionInUrl: true, persistSession: true } });

      const pedirSenha = email => {
        $('f-login').classList.add('hidden'); $('f-senha').classList.remove('hidden');
        $('senha-email').textContent = email ? 'Conta: ' + email : '';
        setTimeout(() => $('nova').focus(), 50);
      };

      sb.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY') pedirSenha(session?.user?.email);
      });

      const qs = new URLSearchParams(location.search);
      const inicio = (async () => {
        try {
          if (qs.get('token_hash')) {
            const { error } = await sb.auth.verifyOtp({ token_hash: qs.get('token_hash'), type: qs.get('type') || 'recovery' });
            history.replaceState(null, '', here);
            if (error) { linkErro = 'otp'; } else if ((qs.get('type') || 'recovery') === 'recovery' || qs.get('type') === 'invite') { return 'senha'; }
          } else if (qs.get('code')) {
            const { error } = await sb.auth.exchangeCodeForSession(qs.get('code'));
            history.replaceState(null, '', here);
            if (error) linkErro = 'code'; else return 'senha';
          }
        } catch (e) { linkErro = 'erro'; }
        return null;
      })();

      inicio.then(modo => sb.auth.getSession().then(({ data }) => {
        if (modo === 'senha' && data.session) { pedirSenha(data.session.user.email); return; }
        if (linkErro && data.session) { location.replace(safeNext); return; }
        if (!data.session) {
          if (linkErro) show('Este link do e-mail já foi usado ou expirou (cada link funciona uma vez só). Entre com seu e-mail e a senha que você criou.', false);
          return;
        }
        if (linkType === 'invite' || linkType === 'recovery') pedirSenha(data.session.user.email);
        else location.replace(safeNext);
      }));

      $('f-login').addEventListener('submit', async e => {
        e.preventDefault();
        if (!$('pass').value) { show('Digite sua senha.', false); return; }
        $('btn').disabled = true; $('btn').textContent = 'Entrando…';
        const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
        if (error) { show(traduz(error), false); $('btn').disabled = false; $('btn').textContent = 'Entrar'; return; }
        location.replace(safeNext);
      });


      $('btn-reset').onclick = async () => {
        const email = $('email').value.trim();
        if (!email) { show('Digite seu e-mail primeiro.', false); $('email').focus(); return; }
        if (!confirm('Enviar um código para ' + email + ' para criar uma nova senha?\n\nO plano grátis envia no máximo 2 e-mails por hora.')) return;
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: here });
        if (error) { show(traduz(error), false); return; }
        $('f-login').classList.add('hidden'); $('f-codigo').classList.remove('hidden'); $('msg').className = 'hidden';
        $('cod-info').textContent = 'Enviamos um e-mail para ' + email + '. Abra e toque no link UMA vez: ele abre a tela de criar senha. Se o e-mail trouxer um código de 6 dígitos, digite aqui.';
        setTimeout(() => $('codigo').focus(), 100);
      };
      $('cod-voltar').onclick = () => { $('f-codigo').classList.add('hidden'); $('f-login').classList.remove('hidden'); };
      $('f-codigo').addEventListener('submit', async e => {
        e.preventDefault();
        const email = $('email').value.trim(), token = $('codigo').value.replace(/\D/g, '');
        if (token.length < 6) { show('Digite o código de 6 dígitos do e-mail.', false); return; }
        if ($('cnova').value.length < 8) { show('A senha precisa ter pelo menos 8 caracteres.', false); return; }
        if ($('cnova').value !== $('cnova2').value) { show('As senhas não conferem.', false); return; }
        const v = await sb.auth.verifyOtp({ email, token, type: 'recovery' });
        if (v.error) { show(/expired|invalid/i.test(v.error.message) ? 'Código inválido ou expirado. Peça um novo (aguarde se já pediu 2 nesta hora).' : traduz(v.error), false); return; }
        const u = await sb.auth.updateUser({ password: $('cnova').value });
        if (u.error && !/different/i.test(u.error.message)) { show(traduz(u.error), false); return; }
        show('Senha criada! Entrando…', true);
        setTimeout(() => location.replace(safeNext), 700);
      });

      $('f-senha').addEventListener('submit', async e => {
        e.preventDefault();
        if ($('nova').value !== $('nova2').value) { show('As senhas não conferem.', false); return; }
        const { error } = await sb.auth.updateUser({ password: $('nova').value });
        if (error) { show(/should be different/i.test(error.message) ? 'Essa já é a sua senha atual. Pode entrar com ela.' : traduz(error), false); return; }
        history.replaceState(null, '', here);
        show('Senha criada!', true);
        setTimeout(() => location.replace(safeNext), 600);
      });
    }
  </script>
</body>
</html>
