<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Plassô | Entrar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: #030712; }
    .fi { margin-top: 4px; width: 100%; background: #030712; border: 1px solid #1f2937; border-radius: 12px; padding: 10px 12px; font-size: 15px; color: #fff; outline: none; }
    .fi:focus { border-color: #3b82f6; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-200">
  <div class="w-full max-w-sm bg-[#0b0f19] border border-[#1f2937] rounded-2xl p-7 space-y-5 shadow-2xl">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center font-bold text-white text-lg font-mono">P</div>
      <div>
        <p class="font-bold tracking-widest text-white uppercase">Plassô</p>
        <p class="text-[10px] text-blue-400 font-mono tracking-wider">ACESSO PRIVADO</p>
      </div>
    </div>
    <div id="msg" class="hidden text-xs rounded-xl px-3 py-2"></div>

    <!-- Entrar -->
    <form id="f-login" class="space-y-4">
      <label class="block text-xs text-slate-400">E-mail<input id="email" type="email" autocomplete="username" required class="fi"></label>
      <label class="block text-xs text-slate-400">Senha<input id="pass" type="password" autocomplete="current-password" class="fi"></label>
      <button id="btn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl py-2.5 text-sm transition">Entrar</button>
      <div class="flex justify-end text-[11px]">
        <button type="button" id="btn-reset" class="text-slate-400 hover:underline">Esqueci a senha</button>
      </div>
    </form>

    <!-- Criar / trocar senha (após convite ou "esqueci a senha") -->
    <form id="f-senha" class="hidden space-y-4">
      <p class="text-sm text-white font-semibold">Crie sua senha de acesso</p>
      <p class="text-xs text-slate-400" id="senha-email"></p>
      <label class="block text-xs text-slate-400">Nova senha (mínimo 8 caracteres)<input id="nova" type="password" autocomplete="new-password" minlength="8" required class="fi"></label>
      <label class="block text-xs text-slate-400">Repita a senha<input id="nova2" type="password" autocomplete="new-password" minlength="8" required class="fi"></label>
      <button class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl py-2.5 text-sm">Salvar senha e entrar</button>
    </form>

    <p class="text-[10px] text-slate-600 text-center"><i class="fa-solid fa-lock"></i> Dados protegidos por login e regras de acesso no banco.</p>
  </div>

  <script src="assets/config.js?v=3"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
  <script>
    const cfg = window.PLASSO_CONFIG || {};
    const $ = id => document.getElementById(id);
    const show = (t, ok) => { $('msg').textContent = t; $('msg').className = 'text-xs rounded-xl px-3 py-2 ' + (ok ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'bg-red-950 text-red-300 border border-red-800'); };
    const next = new URLSearchParams(location.search).get('next') || 'index.html';
    const safeNext = /^[a-z0-9_-]+\.html(\?.*)?$/i.test(next) ? next : 'index.html';
    const here = location.href.split('#')[0].split('?')[0];
    const linkType = (location.hash.match(/type=([a-z_]+)/) || [])[1];
    let linkErro = null;
    if (/error_description=|error_code=/.test(location.hash)) {
      linkErro = (location.hash.match(/error_code=([a-z_]+)/) || [])[1] || 'erro';
      history.replaceState(null, '', location.pathname + location.search); // não deixa o link inválido derrubar a sessão
    }
    const traduz = err => {
      const c = (err && (err.code || err.error_code)) || '';
      const m = (err && err.message) || '';
      if (c === 'over_email_send_rate_limit' || /rate limit/i.test(m)) return 'Limite de e-mails atingido (o plano grátis envia só 2 por hora). Entre com seu e-mail e senha, ou tente de novo daqui a 1 hora.';
      if (c === 'invalid_credentials' || /Invalid login/i.test(m)) return 'E-mail ou senha incorretos.';
      if (/after \d+ seconds/i.test(m)) return 'Aguarde 1 minuto antes de pedir outro e-mail.';
      return m || 'Algo deu errado. Tente novamente.';
    };

    if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) {
      show('Banco ainda não configurado (assets/config.js). O sistema funciona em modo local.', false);
      $('f-login').onsubmit = e => { e.preventDefault(); location.href = safeNext; };
      $('btn').textContent = 'Continuar em modo local';
    } else {
      const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, { auth: { detectSessionInUrl: true, persistSession: true } });

      const pedirSenha = email => {
        $('f-login').classList.add('hidden'); $('f-senha').classList.remove('hidden');
        $('senha-email').textContent = email ? 'Conta: ' + email : '';
        setTimeout(() => $('nova').focus(), 50);
      };

      sb.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY') pedirSenha(session?.user?.email);
      });

      sb.auth.getSession().then(({ data }) => {
        if (linkErro && data.session) { location.replace(safeNext); return; }
        if (!data.session) {
          if (linkErro) show('Este link do e-mail já foi usado ou expirou (cada link funciona uma vez só). Entre com seu e-mail e a senha que você criou.', false);
          return;
        }
        if (linkType === 'invite' || linkType === 'recovery') pedirSenha(data.session.user.email);
        else location.replace(safeNext);
      });

      $('f-login').addEventListener('submit', async e => {
        e.preventDefault();
        if (!$('pass').value) { show('Digite sua senha.', false); return; }
        $('btn').disabled = true; $('btn').textContent = 'Entrando…';
        const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
        if (error) { show(traduz(error), false); $('btn').disabled = false; $('btn').textContent = 'Entrar'; return; }
        location.replace(safeNext);
      });


      $('btn-reset').onclick = async () => {
        const email = $('email').value.trim();
        if (!email) { show('Digite seu e-mail primeiro.', false); return; }
        if (!confirm('Enviar um e-mail para criar uma nova senha?\n\nO plano grátis envia só 2 e-mails por hora — use apenas se esqueceu a senha. Abra o link UMA vez só.')) return;
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: here });
        show(error ? traduz(error) : 'Enviamos um link para criar uma nova senha. Abra o e-mail e clique no link uma vez só.', !error);
      };

      $('f-senha').addEventListener('submit', async e => {
        e.preventDefault();
        if ($('nova').value !== $('nova2').value) { show('As senhas não conferem.', false); return; }
        const { error } = await sb.auth.updateUser({ password: $('nova').value });
        if (error) { show(/should be different/i.test(error.message) ? 'Essa já é a sua senha atual. Pode entrar com ela.' : traduz(error), false); return; }
        history.replaceState(null, '', here);
        show('Senha criada!', true);
        setTimeout(() => location.replace(safeNext), 600);
      });
    }
  </script>
</body>
</html>
