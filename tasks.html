<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060918">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Plassô | Tasks</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/ui.css?v=8">
</head>
<body data-theme="empresa">
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="brand-mark">P</div><div><div class="brand-name">Empresa</div><div class="brand-sub">Tasks</div></div></div>
    <div class="row">
      <button class="chip-btn" onclick="UI.menu()" aria-label="Menu"><i class="fa-solid fa-ellipsis"></i></button>
    </div>
  </header>
  <nav id="subnav"></nav>

  <div class="row-between" style="align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:18px">
    <div>
      <div class="eyebrow" id="resumo"></div>
      <h1 class="display mt-2">Tasks</h1>
    </div>
    <div class="pair">
      <button class="btn btn-white" onclick="novo()">Novo conteúdo</button>
      <button class="chip-btn accent" style="width:46px;height:46px" onclick="novo()" aria-label="Novo conteúdo"><i class="fa-solid fa-plus"></i></button>
    </div>
  </div>

  <div class="row mb-3" style="flex-wrap:wrap">
    <div class="grow" style="position:relative;min-width:200px">
      <i class="fa-solid fa-magnifying-glass muted" style="position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:13px"></i>
      <input class="input" id="busca" placeholder="Buscar conteúdo…" style="padding-left:40px">
    </div>
    <select class="select" id="f-cliente" style="width:auto;min-width:170px;flex:1 1 170px" aria-label="Filtrar por cliente"></select>
  </div>

  <!-- celular: filtro por status + lista -->
  <div class="md-hide-board">
    <div class="seg mb-3" id="f-status"></div>
    <div id="lista" class="stack"></div>
  </div>
  <!-- desktop: quadro -->
  <div class="board" id="board" style="--cols:4"></div>
</div>

<style>
  #board { display: none; }
  @media (min-width: 900px) { #board { display: grid; } .md-hide-board { display: none; } }
</style>

<script src="assets/config.js?v=8"></script>
<script src="assets/core.js?v=8" data-mode="app"></script>
<script src="assets/ui.js?v=8"></script>
<script src="assets/empresa.js?v=8"></script>
<script type="text/plain" data-app>
  UI.mount({ tab: 'empresa', sub: 'tasks' });
  const { esc, T, STATUS } = UI;
  const $ = id => document.getElementById(id);
  const qp = new URLSearchParams(location.search);
  let status = qp.get('status') || 'ativos';
  let cliente = '';
  let busca = '';

  function filtrados() {
    return T.conteudos().filter(t => (!cliente || (t.client || '') === cliente) && (!busca || (T.titulo(t) + ' ' + (t.client || '') + ' ' + (t.type || '')).toLowerCase().includes(busca)));
  }
  const ordenar = arr => arr.sort((a, b) => (b.isRejected ? 1 : 0) - (a.isRejected ? 1 : 0) || (a.date || '9999').localeCompare(b.date || '9999'));

  function renderFiltros() {
    const nomes = [...new Set(T.conteudos().map(t => t.client).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    $('f-cliente').innerHTML = `<option value="">Todos os clientes</option>` + nomes.map(n => `<option ${n === cliente ? 'selected' : ''}>${esc(n)}</option>`).join('');
    const base = filtrados();
    const cont = id => id === 'ativos' ? base.filter(t => T.status(t) !== 'aprovadas').length : id === 'todos' ? base.length : base.filter(t => T.status(t) === id).length;
    const opts = [{ id: 'ativos', label: 'Em aberto' }, ...STATUS, { id: 'todos', label: 'Todos' }];
    $('f-status').innerHTML = opts.map(o => `<button data-s="${o.id}" class="${o.id === status ? 'on' : ''}">${o.label}<span class="count">${cont(o.id)}</span></button>`).join('');
    $('f-status').querySelectorAll('button').forEach(b => b.onclick = () => { status = b.dataset.s; render(); });
    const total = T.conteudos(), urg = total.filter(t => T.status(t) === 'urgent').length;
    $('resumo').textContent = `${total.filter(t => T.status(t) !== 'aprovadas').length} em aberto · ${urg} urgente${urg !== 1 ? 's' : ''}`;
  }

  function renderLista() {
    let arr = filtrados();
    if (status === 'ativos') arr = arr.filter(t => T.status(t) !== 'aprovadas');
    else if (status !== 'todos') arr = arr.filter(t => T.status(t) === status);
    ordenar(arr);
    $('lista').innerHTML = arr.map(t => Empresa.card(t)).join('') || `<div class="card empty"><i class="fa-solid fa-list-check"></i>Nada aqui.<br><button class="btn btn-white btn-sm mt-3" onclick="novo()">Novo conteúdo</button></div>`;
  }

  function renderBoard() {
    const base = filtrados();
    $('board').innerHTML = STATUS.map(s => {
      const arr = ordenar(base.filter(t => T.status(t) === s.id));
      return `<div class="col">
        <div class="col-head"><span class="h3">${s.label}</span><span class="pill ${s.pill}">${arr.length}</span></div>
        <div class="col-drop" data-col="${s.id}">${arr.map(t => Empresa.card(t).replace('<button ', '<button draggable="true" ')).join('') || '<div class="muted small center" style="padding:18px 6px">Arraste para cá</div>'}</div>
      </div>`;
    }).join('');
    // arrastar e soltar (desktop)
    $('board').querySelectorAll('[draggable]').forEach(c => c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', c.dataset.task); e.dataTransfer.effectAllowed = 'move'; }));
    $('board').querySelectorAll('.col-drop').forEach(z => {
      z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('over'); });
      z.addEventListener('dragleave', () => z.classList.remove('over'));
      z.addEventListener('drop', e => { e.preventDefault(); z.classList.remove('over'); const id = e.dataTransfer.getData('text/plain'); if (id) { Empresa.mover(id, z.dataset.col); render(); App.toast('Movido para ' + T.statusInfo(z.dataset.col).label, 'ok'); } });
    });
  }

  function bindCards() { document.querySelectorAll('[data-task]').forEach(c => c.onclick = () => Empresa.abrir(c.dataset.task, render)); }
  function render() { renderFiltros(); renderLista(); renderBoard(); bindCards(); }
  function novo() { Empresa.editarConteudo(null, cliente ? { client: cliente } : {}, render); }

  $('busca').addEventListener('input', e => { busca = e.target.value.toLowerCase().trim(); render(); });
  $('f-cliente').addEventListener('change', e => { cliente = e.target.value; render(); });
  render();
  if (qp.get('t')) Empresa.abrir(qp.get('t'), render);
  if (qp.get('novo')) novo();
</script>
</body>
</html>
