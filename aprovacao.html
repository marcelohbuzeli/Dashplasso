<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060918">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Plassô | Aprovação</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/ui.css?v=12">
<link rel="icon" href="assets/icons/favicon-empresa.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon-empresa-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-empresa.png">
</head>
<body data-theme="empresa">
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="brand-mark">P</div><div><div class="brand-name">Empresa</div><div class="brand-sub">Central de aprovação</div></div></div>
    <div class="row">
      <button class="chip-btn" onclick="Empresa.editarConteudo(null, cliente ? { client: cliente } : {}, render)" aria-label="Novo conteúdo"><i class="fa-solid fa-plus"></i></button>
      <button class="chip-btn" onclick="UI.menu()" aria-label="Menu"><i class="fa-solid fa-ellipsis"></i></button>
    </div>
  </header>
  <nav id="subnav"></nav>

  <div class="hero">
    <div class="eyebrow" id="resumo"></div>
    <h1 class="display mt-2">Central de<br><span class="soft">aprovação</span></h1>
    <p><b>Etapa 1:</b> o cliente aprova o roteiro e a legenda antes da gravação. <b>Etapa 2:</b> aprova a versão final (marcada como <b>Pronto</b> e com o link do Drive). Pedidos de ajuste ficam sempre no topo.</p>
  </div>

  <div class="grid g-2 lg-g-4 mb-4" id="kpis"></div>

  <div class="row mb-4" style="flex-wrap:wrap">
    <select class="select" id="f-cliente" style="width:auto;min-width:200px;flex:1 1 200px" aria-label="Filtrar por cliente"></select>
    <div class="row" id="acoes-cliente"></div>
  </div>

  <section id="sec-roteiros" class="mb-4"></section>
  <section id="sec-ajustes"></section>
  <section id="sec-cliente"></section>
  <section id="sec-semdrive"></section>
  <section id="sec-producao"></section>
  <section id="sec-aprovados"></section>
</div>

<script src="assets/config.js?v=10"></script>
<script src="assets/core.js?v=13" data-mode="app"></script>
<script src="assets/ui.js?v=14"></script>
<script src="assets/integracao.js?v=11"></script>
<script src="assets/empresa.js?v=17"></script>
<script type="text/plain" data-app>
  UI.mount({ tab: 'empresa', sub: 'aprovacao' });
  const { esc, T } = UI;
  const $ = id => document.getElementById(id);
  const qp = new URLSearchParams(location.search);
  let cliente = qp.get('cliente') || '';

  const base = () => T.conteudos().filter(t => !cliente || (t.client || '').toLowerCase() === cliente.toLowerCase());
  const ord = arr => arr.sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999'));

  function quadro(t) {
    const st = T.statusInfo(T.status(t));
    const capa = UI.capaUrl(t);
    const n = (t.midias || []).length;
    return `<button class="quadro ${t.isRejected ? 'rejeitado' : ''}" data-q="${esc(t.id)}">
      ${capa ? `<img src="${capa}" alt="" loading="lazy" onerror="this.remove()">` : `<div class="sem-midia"><i class="fa-solid ${/carrossel/i.test(t.type || '') ? 'fa-images' : /reels|v[ií]deo/i.test(t.type || '') ? 'fa-film' : 'fa-image'}"></i></div>`}
      <div class="q-top"><span class="pill ${t.isRejected ? 'pill-danger' : st.pill}">${t.isRejected ? 'Ajuste pedido' : st.label}</span>${n > 1 ? `<span class="pill"><i class="fa-solid fa-clone"></i>${n}</span>` : n === 1 && t.midias[0].tipo === 'video' ? '<span class="pill"><i class="fa-solid fa-play"></i></span>' : ''}</div>
      <div class="q-info"><div class="t">${esc(T.titulo(t))}</div><div class="s">${esc([t.client, t.type, t.date ? UI.diaMes(t.date) : ''].filter(Boolean).join(' · '))}</div></div>
    </button>`;
  }
  function secao(id, titulo, icon, arr, vazio, extra = '') {
    $(id).innerHTML = `<div class="section-title"><h2 class="h2"><i class="fa-solid ${icon} accent-text" style="font-size:16px"></i> ${titulo} <span class="muted">${arr.length}</span></h2>${extra}</div>
      ${arr.length ? `<div class="galeria">${arr.map(quadro).join('')}</div>` : `<div class="card empty" style="padding:18px">${vazio}</div>`}`;
  }

  // ---------- etapa 1: roteiro e legenda ----------
  const temTexto = t => String(t.roteiro || '').trim() || String(t.legenda || t.caption || '').trim();
  const ROT = { enviado: { l: 'Com o cliente', pill: 'pill-warn' }, ajuste: { l: 'Ajuste pedido', pill: 'pill-danger' }, aprovado: { l: 'Roteiro aprovado', pill: 'pill-ok' } };
  function linhaRot(t, reenviar) {
    const r = ROT[t.aprovRoteiro];
    return `<div class="item">
      <div class="grow" style="min-width:0"><div class="title truncate">${esc(T.titulo(t))}</div>
        <div class="sub truncate">${esc([cliente ? '' : t.client, t.type, t.date ? UI.diaMes(t.date) : ''].filter(Boolean).join(' · '))}</div>
        ${t.aprovRoteiro === 'ajuste' && t.roteiroFeedback ? `<div class="small mt-1" style="color:#ff9aa7">“${esc(t.roteiroFeedback)}”</div>` : ''}</div>
      ${r ? `<span class="pill ${r.pill}">${r.l}</span>` : ''}
      <button class="btn btn-ghost btn-sm" data-abrir-rot="${esc(t.id)}">Abrir</button>
      ${reenviar ? `<button class="btn btn-white btn-sm" data-reenviar="${esc(t.id)}">Reenviar</button>` : ''}
    </div>`;
  }
  function enviarRoteiros(arr) {
    const agora = new Date().toISOString();
    DB.putMany('tasks', arr.map(t => { const n = { ...t, aprovRoteiro: 'enviado', roteiroEnviadoEm: agora }; delete n.roteiroFeedback; delete n.aprovRoteiroEm; return n; }));
  }
  function renderRoteiros(all) {
    const ativos = all.filter(t => !T.encerrado(t) && !T.paraCliente(t));
    const ajuste = ord(ativos.filter(t => t.aprovRoteiro === 'ajuste'));
    const enviados = ord(ativos.filter(t => t.aprovRoteiro === 'enviado'));
    const paraEnviar = ord(ativos.filter(t => !t.aprovRoteiro && temTexto(t)));
    const aprovados = ord(ativos.filter(t => t.aprovRoteiro === 'aprovado'));
    const el = $('sec-roteiros');
    if (!ajuste.length && !enviados.length && !paraEnviar.length && !aprovados.length) { el.innerHTML = ''; return; }
    const bloco = (titulo, arr, reenviar) => arr.length ? `<div class="eyebrow mt-3 mb-2">${titulo} · ${arr.length}</div><div class="list">${arr.map(t => linhaRot(t, reenviar)).join('')}</div>` : '';
    el.innerHTML = `<div class="card">
      <div class="row-between" style="flex-wrap:wrap;gap:10px">
        <h2 class="h2" style="margin:0"><i class="fa-solid fa-file-pen accent-text" style="font-size:16px"></i> Roteiros e legendas <span class="muted small">etapa 1</span></h2>
        ${paraEnviar.length ? (cliente ? `<button class="btn btn-white btn-sm" id="enviar-rot"><i class="fa-solid fa-paper-plane"></i> Enviar ${paraEnviar.length} para aprovação</button>` : '<span class="tiny muted">Escolha um cliente para enviar os roteiros</span>') : ''}
      </div>
      ${bloco('Ajuste pedido no roteiro (edite e reenvie)', ajuste, true)}
      ${bloco('Com o cliente', enviados, false)}
      ${bloco('Prontos para enviar', paraEnviar, false)}
      ${aprovados.length ? `<details class="mt-3"><summary class="small muted" style="cursor:pointer">${aprovados.length} roteiro(s) aprovado(s): pode gravar</summary><div class="list mt-2">${aprovados.map(t => linhaRot(t, false)).join('')}</div></details>` : ''}
    </div>`;
    el.querySelectorAll('[data-abrir-rot]').forEach(b => b.onclick = () => Empresa.editarConteudo(b.dataset.abrirRot, {}, render));
    el.querySelectorAll('[data-reenviar]').forEach(b => b.onclick = () => { enviarRoteiros([DB.get('tasks', b.dataset.reenviar)]); render(); App.toast('Roteiro reenviado ao cliente.', 'ok'); });
    const env = $('enviar-rot');
    if (env) env.onclick = () => {
      if (!confirm(`Enviar ${paraEnviar.length} roteiro(s) de ${cliente} para aprovação? O cliente passa a ver o roteiro e a legenda no link.`)) return;
      enviarRoteiros(paraEnviar); render();
      const c = DB.list('clients').find(x => x.name.toLowerCase() === cliente.toLowerCase());
      App.toast('Roteiros enviados. Agora mande o link para o cliente.', 'ok');
      if (c && c.whatsapp) {
        Integracao.ensurePortalToken(c);
        const atual = DB.get('clients', c.id);
        window.open(Integracao.whatsappLink(atual, `Olá, ${atual.name}! Os roteiros e as legendas dos próximos conteúdos estão prontos 📝\n\nÉ só abrir o link, ler e aprovar (ou pedir ajuste). Depois da sua aprovação a gente grava:\n${Integracao.portalUrl(atual)}`), '_blank');
      }
    };
  }

  function render() {
    const nomes = [...new Set(T.conteudos().map(t => t.client).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    $('f-cliente').innerHTML = '<option value="">Todos os clientes</option>' + nomes.map(n => `<option ${n === cliente ? 'selected' : ''}>${esc(n)}</option>`).join('');
    const c = cliente ? DB.list('clients').find(x => x.name.toLowerCase() === cliente.toLowerCase()) : null;
    $('acoes-cliente').innerHTML = c ? `<button class="btn btn-white btn-sm" id="wa"><i class="fa-brands fa-whatsapp"></i> Enviar link</button><a class="btn btn-ghost btn-sm" id="ver" target="_blank" rel="noopener"><i class="fa-solid fa-eye"></i> Ver como o cliente</a>` : '';
    if (c) {
      Integracao.ensurePortalToken(c);
      $('ver').href = Integracao.portalUrl(DB.get('clients', c.id)) + (/^(localhost|127)/.test(location.hostname) ? '&local=1' : '');
      $('wa').onclick = () => {
        const atual = DB.get('clients', c.id);
        if (!atual.whatsapp) { App.toast('Cadastre o WhatsApp na ficha do cliente.', 'warn'); location.href = UI.keepParams('clients.html?c=' + encodeURIComponent(c.id)); return; }
        window.open(Integracao.whatsappLink(atual, `Olá, ${atual.name}! Seus conteúdos estão prontos para aprovação 🎬\n\nÉ só abrir o link, conferir e aprovar (ou pedir ajuste):\n${Integracao.portalUrl(atual)}`), '_blank');
      };
    }
    const all = base();
    renderRoteiros(all);
    const ajustes = ord(all.filter(t => t.isRejected));
    const comCliente = ord(all.filter(t => T.paraCliente(t)));
    const semDrive = ord(all.filter(t => !t.isRejected && T.status(t) === 'pronto' && !T.completo(t)));
    const producao = ord(all.filter(t => !t.isRejected && ['urgent', 'afazer'].includes(T.status(t))));
    const aprovados = ord(all.filter(t => T.status(t) === 'aprovadas'));
    const k = (icon, cor, l, v, h) => `<div class="card stat"><span class="label"><i class="fa-solid ${icon}" style="color:${cor}"></i>${l}</span><span class="value">${v}</span><span class="hint">${h}</span></div>`;
    $('kpis').innerHTML = k('fa-rotate-left', 'var(--danger)', 'Ajustes', ajustes.length, 'pedidos pelo cliente') + k('fa-hourglass-half', 'var(--warn)', 'Com o cliente', comCliente.length, 'aguardando aprovação') + k('fa-clapperboard', 'var(--accent)', 'Em produção', producao.length, 'para finalizar') + k('fa-circle-check', 'var(--ok)', 'Aprovados', aprovados.length, 'aguardando postar');
    $('resumo').textContent = ajustes.length ? `${ajustes.length} ajuste${ajustes.length > 1 ? 's' : ''} para fazer agora` : comCliente.length ? `${comCliente.length} aguardando o cliente` : 'Tudo em dia';
    secao('sec-ajustes', 'Ajustes pedidos', 'fa-rotate-left', ajustes, '<i class="fa-solid fa-face-smile"></i>Nenhum pedido de ajuste.');
    secao('sec-cliente', 'Com o cliente', 'fa-hourglass-half', comCliente, 'Nada aguardando o cliente. Marque um conteúdo como <b>Pronto</b> e cole o link do Drive para ele aparecer aqui e no link do cliente.');
    secao('sec-semdrive', 'Prontos sem link do Drive', 'fa-link-slash', semDrive, 'Nenhum. Tudo que está pronto já tem o link da versão final.');
    secao('sec-producao', 'Em produção', 'fa-clapperboard', producao, 'Nada em produção.');
    secao('sec-aprovados', 'Aprovados (aguardando postar)', 'fa-circle-check', aprovados, 'Nenhum aprovado aguardando postagem.');
    $('sec-semdrive').style.display = semDrive.length ? '' : 'none';
    document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => Empresa.preview(b.dataset.q, render));
  }
  $('f-cliente').addEventListener('change', e => { cliente = e.target.value; render(); });
  render();
  if (qp.get('t')) Empresa.preview(qp.get('t'), render);
</script>
</body>
</html>
