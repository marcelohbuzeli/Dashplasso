<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060918">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Plassô | Instagram</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/ui.css?v=12">
<link rel="icon" href="assets/icons/favicon-empresa.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon-empresa-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-empresa.png">
<style>
  .barras { display: flex; align-items: flex-end; gap: 3px; height: 140px; padding-top: 8px; }
  .barras > div { flex: 1; min-width: 3px; background: var(--accent); border-radius: 3px 3px 0 0; opacity: .85; position: relative; }
  .barras > div:hover { opacity: 1; }
  .barras > div[title=""] { opacity: .25; }
  .post { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .post:last-child { border-bottom: 0; }
  .post img, .post .sem-capa { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; background: var(--glass-2); display: grid; place-items: center; }
  .post .nums { display: flex; gap: 12px; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .post .nums b { color: var(--ink); font-weight: 600; }
  @media (max-width: 640px) { .post { grid-template-columns: 48px 1fr; } .post .nums { grid-column: 1 / -1; } }
  .rel p { margin: 6px 0 0; }
  .rel ul { margin: 6px 0 0; padding-left: 18px; }
</style>
</head>
<body data-theme="empresa">
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="brand-mark">P</div><div><div class="brand-name">Empresa</div><div class="brand-sub">Instagram dos clientes</div></div></div>
    <div class="row"><button class="chip-btn" onclick="UI.menu()" aria-label="Menu"><i class="fa-solid fa-ellipsis"></i></button></div>
  </header>
  <nav id="subnav"></nav>

  <div class="hero">
    <div class="eyebrow" id="resumo">API oficial da Meta</div>
    <h1 class="display mt-2">Instagram<br><span class="soft">dos clientes</span></h1>
    <p>Conecte a conta de cada cliente para agendar posts, acompanhar as métricas (atualizadas todo dia às 6h) e pedir a análise do mês ao Jarvis.</p>
  </div>

  <div class="card card-tight mb-4" id="token"></div>

  <div class="row mb-4" style="flex-wrap:wrap">
    <select class="select" id="f-cliente" style="width:auto;min-width:220px;flex:1 1 220px" aria-label="Cliente"></select>
    <div class="row" id="acoes-cliente"></div>
  </div>

  <section id="conexao" class="mb-4"></section>
  <div class="grid g-2 md-g-4 mb-4" id="kpis"></div>
  <section id="grafico" class="mb-4"></section>
  <section id="analise" class="mb-4"></section>
  <section id="posts" class="mb-4"></section>
</div>

<script src="assets/config.js?v=10"></script>
<script src="assets/core.js?v=12" data-mode="app"></script>
<script src="assets/ui.js?v=13"></script>
<script type="text/plain" data-app>
  UI.mount({ tab: 'empresa', sub: 'instagram' });
  const { esc, T } = UI;
  const $ = id => document.getElementById(id);
  const norm = c => String(c || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  const num = v => v == null ? '–' : Number(v).toLocaleString('pt-BR');
  const sb = () => window.App && App.supabase;
  const qp = new URLSearchParams(location.search);
  let cliente = qp.get('cliente') || '';
  let estado = { alcancadas: [], ligadas: [], token: null, carregado: false, erro: '' };

  async function fn(nome, body) {
    const { data, error } = await sb().functions.invoke(nome, { body });
    if (error) { let msg = error.message; try { msg = (await error.context.json()).erro || msg; } catch (e) {} throw new Error(msg); }
    if (data && data.erro) throw new Error(data.erro);
    return data;
  }

  async function carregarContas() {
    if (!sb()) { estado.erro = 'Banco desligado (modo de teste).'; return; }
    try { const d = await fn('instagram-publicar', { modo: 'contas' }); Object.assign(estado, d, { carregado: true, erro: '' }); }
    catch (e) { estado.erro = e.message; estado.carregado = true; }
  }

  function renderToken() {
    const t = estado.token;
    let txt;
    if (!estado.carregado) txt = '<span class="small muted"><i class="fa-solid fa-spinner fa-spin"></i> Conferindo a conexão com a Meta…</span>';
    else if (estado.erro) txt = `<span class="small" style="color:#ff8b99"><i class="fa-solid fa-triangle-exclamation"></i> ${esc(estado.erro)}</span>`;
    else {
      const exp = t && t.expira ? new Date(t.expira) : null;
      const dias = exp ? Math.round((exp - Date.now()) / 864e5) : null;
      const validade = t && t.nuncaExpira ? 'token permanente' : exp ? `token vence em ${dias} dia(s) (${exp.toLocaleDateString('pt-BR')})` : 'validade do token não informada';
      const alerta = dias != null && dias < 15;
      const faltam = t && Array.isArray(t.faltam) ? t.faltam : null;
      txt = `<div class="row-between" style="flex-wrap:wrap"><span class="small"><i class="fa-brands fa-meta accent-text"></i> Meta conectada${t && t.quem ? ' (' + esc(t.quem) + ')' : ''} · ${estado.alcancadas.length} conta(s) de Instagram ao alcance · <span style="${alerta ? 'color:#ff8b99' : ''}">${validade}</span></span>
        <span class="tiny muted">${estado.ligadas.length} cliente(s) ligado(s)</span></div>
        ${alerta ? '<p class="tiny mt-2" style="color:#ff8b99;margin-bottom:0">Gere um token novo (de preferência de usuário do sistema, que não vence) e troque o segredo META_IG_TOKEN.</p>' : ''}
        ${faltam && faltam.length ? `<p class="tiny mt-2" style="color:#ffb86b;margin-bottom:0">Faltam permissões no token: ${faltam.map(esc).join(', ')}. Sem elas, ${faltam.includes('instagram_manage_insights') ? 'as métricas não chegam' : 'algumas funções não funcionam'}. Gere o token de novo marcando essas permissões.</p>` : ''}
        ${faltam === null && !estado.alcancadas.length ? '<p class="tiny mt-2" style="color:#ffb86b;margin-bottom:0">O token atual não lista Páginas, então só alcança a sua conta. Para atender clientes, gere um token de usuário do sistema no seu Business Manager (passo a passo em docs/META-CLIENTES.md).</p>' : ''}`;
    }
    $('token').innerHTML = txt;
  }

  function renderSelect() {
    const clientes = DB.list('clients').map(c => c.name).filter(Boolean);
    const ligados = new Set(estado.ligadas.map(l => l.cliente));
    estado.ligadas.forEach(l => { if (!clientes.some(c => norm(c) === l.cliente)) clientes.push(l.cliente_nome); });
    clientes.sort((a, b) => (ligados.has(norm(b)) - ligados.has(norm(a))) || a.localeCompare(b));
    if (!cliente && clientes.length) cliente = clientes.find(c => ligados.has(norm(c))) || clientes[0];
    $('f-cliente').innerHTML = clientes.map(c => `<option value="${esc(c)}" ${norm(c) === norm(cliente) ? 'selected' : ''}>${esc(c)}${ligados.has(norm(c)) ? ' · conectado' : ''}</option>`).join('');
  }

  const ligacao = () => estado.ligadas.find(l => l.cliente === norm(cliente));

  function renderConexao() {
    const l = ligacao();
    const c = DB.list('clients').find(x => norm(x.name) === norm(cliente)) || {};
    if (!estado.carregado) { $('conexao').innerHTML = ''; return; }
    if (l) {
      $('conexao').innerHTML = `<div class="card card-tight row-between" style="flex-wrap:wrap">
        <span class="small"><i class="fa-brands fa-instagram accent-text"></i> <b>@${esc(l.username || l.ig_id)}</b> ligado a ${esc(l.cliente_nome)} desde ${new Date(l.conectado_em).toLocaleDateString('pt-BR')}</span>
        <div class="row"><button class="btn btn-ghost btn-sm" id="atualizar"><i class="fa-solid fa-rotate"></i> Atualizar métricas</button><button class="btn btn-ghost btn-sm" id="desligar">Desligar</button></div></div>`;
      $('atualizar').onclick = () => atualizar(false);
      $('desligar').onclick = async () => {
        if (!confirm(`Desligar @${l.username} de ${l.cliente_nome}? Os posts agendados deste cliente deixam de sair.`)) return;
        try { await fn('instagram-publicar', { modo: 'desconectar', cliente: l.cliente_nome }); await recarregar(); App.toast('Conta desligada.', 'ok'); } catch (e) { App.toast(e.message, 'err'); }
      };
      return;
    }
    const usadas = new Set(estado.ligadas.map(x => x.ig_id));
    const livres = estado.alcancadas.filter(a => !usadas.has(a.igId));
    const sugerida = livres.find(a => c.instagram && norm(c.instagram).replace(/^@|.*instagram\.com\//g, '').replace(/\/.*/, '') === norm(a.username));
    $('conexao').innerHTML = `<div class="card card-tight">
      <div class="small"><i class="fa-brands fa-instagram"></i> <b>${esc(cliente)}</b> ainda não tem conta do Instagram ligada.</div>
      ${livres.length ? `<div class="row mt-3" style="flex-wrap:wrap">
          <select class="select" id="conta" style="flex:1 1 240px">${livres.map(a => `<option value="${esc(a.igId)}" ${sugerida && sugerida.igId === a.igId ? 'selected' : ''}>@${esc(a.username)} · ${esc(a.pagina)}</option>`).join('')}</select>
          <button class="btn btn-white btn-sm" id="ligar">Ligar a ${esc(cliente)}</button></div>
          <p class="tiny muted mt-2" style="margin-bottom:0">Só aparecem contas profissionais ligadas a uma Página do Facebook que você administra.</p>`
        : `<p class="tiny muted mt-2" style="margin-bottom:0">Nenhuma conta livre ao alcance do token. Para incluir o cliente: a conta do Instagram dele precisa ser profissional, estar ligada à Página do Facebook dele, e essa Página precisa te dar acesso (ou ser adicionada ao seu Business Manager como parceira). Depois, recarregue esta página.</p>`}
    </div>`;
    const b = $('ligar');
    if (b) b.onclick = async () => {
      b.disabled = true;
      try { const r = await fn('instagram-publicar', { modo: 'conectar', cliente, igId: $('conta').value }); await recarregar(); App.toast(`@${r.username} ligado a ${cliente}. Buscando 30 dias de métricas…`, 'ok'); atualizar(true); }
      catch (e) { App.toast(e.message, 'err'); b.disabled = false; }
    };
  }

  async function atualizar(historico) {
    const b = $('atualizar'); if (b) { b.disabled = true; b.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Atualizando…'; }
    try {
      const r = await fn('instagram-metricas', { modo: 'agora', cliente, dias: historico ? 30 : 3 });
      const erro = (r.log || []).find(x => /erro/.test(x));
      App.toast(erro ? erro : 'Métricas atualizadas.', erro ? 'warn' : 'ok');
      await renderMetricas();
    } catch (e) { App.toast(e.message, 'err'); }
    finally { const b2 = $('atualizar'); if (b2) { b2.disabled = false; b2.innerHTML = '<i class="fa-solid fa-rotate"></i> Atualizar métricas'; } }
  }

  async function renderMetricas() {
    const l = ligacao();
    if (!l) { ['kpis', 'grafico', 'analise', 'posts'].forEach(id => $(id).innerHTML = ''); return; }
    const desde = new Date(Date.now() - 31 * 864e5).toISOString().slice(0, 10);
    const [dias, posts] = await Promise.all([
      sb().from('ig_metricas_dia').select('dia,seguidores,dados').eq('ig_id', l.ig_id).gte('dia', desde).order('dia'),
      sb().from('ig_metricas_posts').select('media_id,publicado,tipo,legenda,link,capa,dados').eq('ig_id', l.ig_id).order('publicado', { ascending: false }).limit(30),
    ]);
    const D = dias.data || [], P = posts.data || [];
    const soma = k => D.reduce((a, d) => a + (Number(d.dados?.[k]) || 0), 0);
    const seg = D.filter(d => d.seguidores != null);
    const segAtual = seg.length ? seg[seg.length - 1].seguidores : null;
    const segAntes = seg.length > 1 ? seg[0].seguidores : null;
    const k = (icon, label, v, hint) => `<div class="card stat"><span class="label"><i class="fa-solid ${icon} accent-text"></i>${label}</span><span class="value num">${v}</span><span class="hint">${hint}</span></div>`;
    $('kpis').innerHTML =
      k('fa-users', 'Seguidores', num(segAtual), segAntes != null ? `${segAtual - segAntes >= 0 ? '+' : ''}${num(segAtual - segAntes)} no período` : 'histórico começa hoje') +
      k('fa-eye', 'Visualizações (30 dias)', num(soma('views')), `alcance de ${num(soma('reach'))} contas/dia somadas`) +
      k('fa-heart', 'Interações (30 dias)', num(soma('total_interactions')), `${num(soma('shares'))} compartilhamentos · ${num(soma('saves'))} salvos`) +
      k('fa-calendar-check', 'Posts (30 dias)', num(P.length), P.length ? `${(P.length / 4.3).toFixed(1).replace('.', ',')} por semana` : 'nenhum post no período');

    const serie = D.filter(d => d.dados && d.dados.reach != null);
    const max = Math.max(1, ...serie.map(d => d.dados.reach));
    $('grafico').innerHTML = serie.length ? `<div class="card"><div class="card-head"><span class="eyebrow">Alcance por dia</span><span class="tiny muted">${UI.dataBR(serie[0].dia)} a ${UI.dataBR(serie[serie.length - 1].dia)}</span></div>
      <div class="barras">${serie.map(d => `<div style="height:${Math.max(2, d.dados.reach / max * 100)}%" title="${UI.dataBR(d.dia)}: ${num(d.dados.reach)} contas alcançadas, ${num(d.dados.views)} visualizações"></div>`).join('')}</div></div>`
      : `<div class="card card-tight"><span class="small muted">Ainda não há métricas diárias. Clique em "Atualizar métricas" ou espere a atualização das 6h.</span></div>`;

    const rank = [...P].sort((a, b) => (b.dados?.views || b.dados?.reach || 0) - (a.dados?.views || a.dados?.reach || 0));
    $('posts').innerHTML = P.length ? `<div class="card"><div class="card-head"><span class="eyebrow">Posts dos últimos 30 dias · mais vistos primeiro</span></div>
      ${rank.map(p => `<a class="post" href="${esc(p.link || '#')}" target="_blank" rel="noopener">
        ${p.capa ? `<img src="${esc(p.capa)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : '<div class="sem-capa"><i class="fa-brands fa-instagram muted"></i></div>'}
        <div style="min-width:0"><div class="small truncate"><b>${esc(p.tipo || '')}</b> · ${new Date(p.publicado).toLocaleDateString('pt-BR')}</div><div class="tiny muted truncate">${esc((p.legenda || '').split('\n')[0])}</div></div>
        <div class="nums"><span><b>${num(p.dados?.views)}</b> views</span><span><b>${num(p.dados?.reach)}</b> alcance</span><span><b>${num(p.dados?.likes)}</b> curtidas</span><span><b>${num(p.dados?.shares)}</b> compart.</span><span><b>${num(p.dados?.saved)}</b> salvos</span></div>
      </a>`).join('')}</div>` : '';
    renderAnalise();
  }

  // ---------- análise do mês: fila do Jarvis (coleção ig_relatorios; o Jarvis no Mac faz com o plano do Claude) ----------
  const mesAtual = () => new Date().toISOString().slice(0, 7);
  const relId = () => norm(cliente).replace(/[^a-z0-9]+/g, '_') + '_' + mesAtual();
  function renderAnalise() {
    const l = ligacao(); if (!l) { $('analise').innerHTML = ''; return; }
    const r = DB.get('ig_relatorios', relId());
    const btn = t => `<button class="btn btn-ghost btn-sm" id="pedir-rel"><i class="fa-solid fa-wand-magic-sparkles"></i> ${t}</button>`;
    let corpo;
    if (!r) corpo = `<div class="row-between" style="flex-wrap:wrap"><span class="small muted">Nenhuma análise de ${mesAtual().split('-').reverse().join('/')} ainda.</span>${btn('Pedir análise do mês ao Jarvis')}</div>`;
    else if (r.status === 'na_fila') corpo = '<span class="small muted"><i class="fa-solid fa-hourglass-half"></i> Na fila do Jarvis. Começa assim que ele estiver ligado no Mac.</span>';
    else if (r.status === 'analisando') corpo = '<span class="small muted"><i class="fa-solid fa-spinner fa-spin"></i> O Jarvis está analisando as métricas e os posts…</span>';
    else if (r.status === 'erro') corpo = `<div class="row-between" style="flex-wrap:wrap"><span class="small" style="color:#ff8b99">A análise falhou: ${esc(r.erro || '')}</span>${btn('Tentar de novo')}</div>`;
    else {
      const li = a => (a || []).map(x => `<li>${esc(x)}</li>`).join('');
      corpo = `<div class="rel"><p>${esc(r.resumo || '')}</p>
        ${(r.destaques || []).length ? `<div class="eyebrow mt-3">O que funcionou</div><ul class="small">${li(r.destaques)}</ul>` : ''}
        ${(r.atencao || []).length ? `<div class="eyebrow mt-3">Pontos de atenção</div><ul class="small">${li(r.atencao)}</ul>` : ''}
        ${(r.recomendacoes || []).length ? `<div class="eyebrow mt-3">Próximo mês</div><ul class="small">${li(r.recomendacoes)}</ul>` : ''}
        ${r.mensagem_cliente ? `<div class="eyebrow mt-3">Mensagem para o cliente</div><p class="small" style="white-space:pre-wrap">${esc(r.mensagem_cliente)}</p>` : ''}
        <div class="row mt-3" style="justify-content:space-between;flex-wrap:wrap"><span class="tiny muted">Feita em ${new Date(r.em).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}</span>${btn('Refazer')}</div></div>`;
    }
    $('analise').innerHTML = `<div class="card"><div class="card-head"><span class="eyebrow">Análise do mês</span></div>${corpo}</div>`;
    const b = $('pedir-rel');
    if (b) b.onclick = () => {
      DB.put('ig_relatorios', { id: relId(), status: 'na_fila', pedidoEm: new Date().toISOString(), cliente, igId: l.ig_id, username: l.username, mes: mesAtual() });
      renderAnalise(); App.toast('Pedido enviado ao Jarvis.', 'ok');
    };
  }

  // ---------- relatório mensal em PDF (janela de impressão: "Salvar como PDF") ----------
  const ym = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  const mesNome = m => { const [y, mm] = m.split('-').map(Number); const s = new Date(y, mm - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); return s.charAt(0).toUpperCase() + s.slice(1); };
  const tarefasDoMes = mes => DB.list('tasks').filter(t => T.isConteudo(t) && (t.client || '').toLowerCase() === (cliente || '').toLowerCase() && (t.date || '').startsWith(mes));
  const feita = t => ['postado', 'aprovadas', 'approved'].includes(t.status);
  // métricas que fazem mais sentido para cada objetivo (marcadas por padrão no painel)
  const OBJ_METRICAS = {
    'Vendas': ['cliques', 'visualizacoes', 'alcance'],
    'Conexão': ['interacoes', 'comentarios', 'compartilhamentos'],
    'Desejo': ['visualizacoes', 'salvos', 'interacoes'],
    'Autoridade': ['salvos', 'alcance', 'seguidores'],
    'Educativo': ['salvos', 'alcance', 'seguidores'],
    'Humor': ['interacoes', 'compartilhamentos', 'alcance'],
    'Trend': ['alcance', 'visualizacoes', 'seguidores'],
  };
  const METRICAS = { seguidores: 'Seguidores ganhos no mês', alcance: 'Alcance (soma dos dias)', visualizacoes: 'Visualizações', interacoes: 'Interações', curtidas: 'Curtidas', comentarios: 'Comentários', compartilhamentos: 'Compartilhamentos', salvos: 'Salvos', cliques: 'Cliques no link do perfil' };
  const CHAVE_DIA = { alcance: 'reach', visualizacoes: 'views', interacoes: 'total_interactions', curtidas: 'likes', comentarios: 'comments', compartilhamentos: 'shares', salvos: 'saves', cliques: 'profile_links_taps' };

  function renderAcoes() {
    $('acoes-cliente').innerHTML = cliente ? '<button class="btn btn-white btn-sm" id="rel-pdf"><i class="fa-solid fa-file-pdf"></i> Gerar relatório PDF</button>' : '';
    const b = $('rel-pdf'); if (b) b.onclick = abrirRelatorio;
  }

  function abrirRelatorio() {
    const hoje = new Date();
    const meses = [];
    for (let i = 0; i < 12; i++) meses.push(ym(new Date(hoje.getFullYear(), hoje.getMonth() - i, 1)));
    const opts = meses.map((m, i) => `<option value="${m}" ${i === 1 ? 'selected' : ''}>${esc(mesNome(m))}</option>`).join(''); // padrão: mês anterior (fechado)
    const s = UI.sheet({ title: 'Relatório mensal', html: `
      <p class="small soft">${esc(cliente)}</p>
      <label class="field mt-3"><span>Mês de referência</span><select class="select" id="rel-mes">${opts}</select></label>
      <div class="eyebrow mt-4">Métricas no relatório</div>
      <div id="rel-metricas" class="stack mt-2"></div>
      <p class="tiny muted mt-2">Objetivos e conteúdos saem sempre. As métricas marcadas aparecem na página 3.</p>`,
      foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-white" id="rel-ok"><i class="fa-solid fa-file-pdf"></i> Gerar PDF</button>' });
    const desenha = () => {
      const mes = s.$('#rel-mes').value;
      const objs = [...new Set(tarefasDoMes(mes).map(t => t.objetivo).filter(Boolean))];
      const pad = [...new Set(objs.flatMap(o => OBJ_METRICAS[o] || []))];
      const marcadas = pad.length ? pad : ['alcance', 'visualizacoes', 'interacoes', 'seguidores'];
      s.$('#rel-metricas').innerHTML = Object.entries(METRICAS).map(([k, l]) => `<label class="row small" style="gap:8px;align-items:center"><input type="checkbox" value="${k}" ${marcadas.includes(k) ? 'checked' : ''}> ${esc(l)}</label>`).join('');
    };
    s.$('#rel-mes').onchange = desenha;
    desenha();
    s.$('#rel-ok').onclick = () => {
      const mes = s.$('#rel-mes').value;
      const metricas = [...s.el.querySelectorAll('#rel-metricas input:checked')].map(i => i.value);
      s.close();
      gerarPDF(mes, metricas);
    };
  }

  async function gerarPDF(mes, metricas) {
    // a janela abre já no clique (senão o navegador bloqueia), depois recebe o relatório
    const w = window.open('', '_blank');
    if (!w) { App.toast('O navegador bloqueou a janela do relatório. Libere pop-ups para este site.', 'err'); return; }
    w.document.write('<p style="font:16px system-ui;padding:24px;background:#060918;color:#aab">Montando o relatório…</p>');
    try {
      const html = await montarRelatorio(mes, metricas);
      w.document.open(); w.document.write(html); w.document.close();
    } catch (e) {
      w.document.open(); w.document.write(`<p style="font:16px system-ui;padding:24px">Não consegui montar o relatório: ${esc(e.message)}</p>`); w.document.close();
    }
  }

  async function montarRelatorio(mes, metricas) {
    const l = ligacao();
    const [y, m] = mes.split('-').map(Number);
    const ini = mes + '-01';
    const fim = mes + '-' + String(new Date(y, m, 0).getDate()).padStart(2, '0');
    const prox = ym(new Date(y, m, 1)) + '-01';
    const iniAnt = ym(new Date(y, m - 2, 1)) + '-01';
    let D = [], P = [];
    if (l && sb()) {
      const [dias, posts] = await Promise.all([
        sb().from('ig_metricas_dia').select('dia,seguidores,dados').eq('ig_id', l.ig_id).gte('dia', iniAnt).lte('dia', fim).order('dia'),
        sb().from('ig_metricas_posts').select('publicado,tipo,dados').eq('ig_id', l.ig_id).gte('publicado', ini).lt('publicado', prox).order('publicado'),
      ]);
      D = dias.data || []; P = posts.data || [];
    }
    // --- conteúdos do mês ---
    const tarefas = tarefasDoMes(mes);
    const feitos = tarefas.filter(feita).length;
    const grupos = {};
    tarefas.forEach(t => { const k = t.objetivo || 'Sem objetivo'; if (!grupos[k]) grupos[k] = { plan: 0, feito: 0 }; grupos[k].plan++; if (feita(t)) grupos[k].feito++; });
    const ordGrupos = Object.entries(grupos).sort((a, b) => b[1].plan - a[1].plan);
    const principal = ordGrupos.filter(([k]) => k !== 'Sem objetivo')[0];
    const pct = tarefas.length ? Math.round(feitos / tarefas.length * 100) : 0;
    // --- métricas ---
    const doMes = D.filter(d => d.dia >= ini);
    const antes = D.filter(d => d.dia < ini && d.seguidores != null);
    const segs = doMes.filter(d => d.seguidores != null);
    const segFim = segs.length ? segs[segs.length - 1].seguidores : null;
    const segBase = antes.length ? antes[antes.length - 1].seguidores : (segs.length ? segs[0].seguidores : null);
    const ganhos = segFim != null && segBase != null ? segFim - segBase : null;
    const soma = k => doMes.reduce((a, d) => a + (Number(d.dados?.[CHAVE_DIA[k]]) || 0), 0);
    const valor = k => !l ? '–' : k === 'seguidores' ? (ganhos == null ? '–' : (ganhos >= 0 ? '+' : '') + num(ganhos)) : num(soma(k));
    const top = [...P].sort((a, b) => (b.dados?.views || 0) - (a.dados?.views || 0))[0];
    const focoTxt = principal ? principal[0] : 'não definido';
    const cards = metricas.filter(k => METRICAS[k]).map(k => `<div class="card"><span>${esc(METRICAS[k])}</span><b>${valor(k)}</b></div>`).join('');

    let grafico = '';
    if (l && metricas.includes('seguidores') && segBase != null && segFim != null) {
      const max = Math.max(segBase, segFim, 1);
      const col = (v, rot) => `<div class="col"><span>${num(v)}</span><div class="bar" style="height:${Math.max(4, v / max * 100)}%"></div><small>${esc(rot)}</small></div>`;
      grafico = `<div class="eyebrow mt">Seguidores</div><div class="chart">${col(segBase, antes.length ? 'fim do mês anterior' : 'início do período')}${col(segFim, 'fim do mês')}</div>`;
    }

    const linhas = ordGrupos.map(([k, g]) => `<tr><td>${esc(k)}</td><td class="n">${g.plan}</td><td class="n">${g.feito}</td></tr>`).join('')
      || '<tr><td colspan="3">Nenhum conteúdo cadastrado neste mês.</td></tr>';

    const css = `
      *{box-sizing:border-box}
      @page{size:A4;margin:0}
      html,body{margin:0;background:#0b0f22;color:#eef1f8;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .page{width:210mm;height:297mm;margin:0 auto;padding:20mm 18mm;position:relative;overflow:hidden;background:linear-gradient(160deg,#121a3d,#060918 70%);page-break-after:always}
      .page:last-of-type{page-break-after:auto}
      .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8fa2ff}
      .marca{font-size:14px;color:#c9d2ef;font-weight:600}
      h1{font-size:54px;line-height:1.02;margin:40mm 0 6mm;font-weight:600}
      h2{font-size:32px;line-height:1.15;margin:4mm 0 8mm;font-weight:600}
      .mes{font-size:22px;color:#c9d2ef}
      .rodape{position:absolute;left:18mm;right:18mm;bottom:12mm;font-size:11px;color:#7d88aa}
      .stats,.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6mm}
      .stats>div,.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px}
      .stats b,.card b{display:block;font-size:30px;font-weight:600;margin-top:4px}
      .stats span,.card span{font-size:12px;color:#aab4d4}
      .mt{margin-top:10mm}
      .barra{height:10px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin:6px 0}
      .barra div{height:100%;background:#3d5bff}
      table{width:100%;border-collapse:collapse;margin-top:6mm;font-size:14px}
      th,td{padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left}
      th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#8fa2ff;font-weight:600}
      .n{text-align:right}
      .chart{display:flex;gap:28px;align-items:flex-end;height:70mm;margin-top:4mm}
      .col{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
      .bar{width:100%;background:linear-gradient(#8fa2ff,#3d5bff);border-radius:10px 10px 0 0}
      .col span{font-size:20px;font-weight:600;margin-bottom:6px}
      .col small{font-size:11px;color:#aab4d4;margin-top:6px}
      .nop{padding:12px;text-align:center;background:#111a3a;font:14px system-ui}
      .nop button{font:600 14px system-ui;padding:8px 16px;border-radius:99px;border:0;background:#fff;color:#0b0f22;cursor:pointer}
      @media print{.nop{display:none}}`;

    return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Relatório · ${esc(cliente)} · ${esc(mesNome(mes))}</title><style>${css}</style></head><body>
      <div class="nop"><button onclick="window.print()">Salvar como PDF</button></div>
      <section class="page">
        <div class="marca">Plassô Marketing</div>
        <div class="eyebrow mt">Relatório mensal</div>
        <h1>${esc(cliente)}</h1>
        <div class="mes">${esc(mesNome(mes))}</div>
        <div class="rodape">Instagram${l ? ' · @' + esc(l.username || l.ig_id) : ' · conta ainda não ligada'}</div>
      </section>
      <section class="page">
        <div class="eyebrow">Objetivos e o que foi feito</div>
        <h2>Foco do mês: ${esc(focoTxt)}</h2>
        <div class="stats">
          <div><span>conteúdos planejados</span><b>${tarefas.length}</b></div>
          <div><span>aprovados ou postados</span><b>${feitos}</b></div>
          <div><span>posts publicados no Instagram</span><b>${l ? P.length : '–'}</b></div>
        </div>
        <div class="eyebrow mt">Esperado x feito</div>
        <div class="barra"><div style="width:${pct}%"></div></div>
        <p class="small">${feitos} de ${tarefas.length} conteúdos (${pct}%)</p>
        <table><thead><tr><th>Objetivo</th><th class="n">Planejados</th><th class="n">Feitos</th></tr></thead><tbody>${linhas}</tbody></table>
        <div class="rodape">"Feito" = aprovado pelo cliente ou já postado.</div>
      </section>
      <section class="page">
        <div class="eyebrow">Métricas e resultados</div>
        <h2>${l ? 'Como o perfil respondeu' : 'Métricas indisponíveis'}</h2>
        ${l ? `<div class="cards">${cards || '<div class="card"><span>Nenhuma métrica selecionada</span></div>'}</div>${grafico}
          ${top ? `<div class="eyebrow mt">Post de destaque</div><p>${esc(top.tipo || 'Post')}, com <b>${num(top.dados?.views)}</b> visualizações, <b>${num(top.dados?.saved)}</b> salvos e <b>${num(top.dados?.shares)}</b> compartilhamentos.</p>` : ''}`
          : '<p class="small">A conta do Instagram deste cliente ainda não está ligada ao Dashplassô. As métricas aparecem aqui depois da ligação.</p>'}
        <div class="rodape">Métricas somadas dos dias do mês. Fonte: API oficial da Meta.</div>
      </section>
    </body></html>`;
  }

  async function recarregar() { await carregarContas(); render(); }
  function render() { renderToken(); renderSelect(); renderConexao(); renderAcoes(); renderMetricas().catch(e => console.warn(e)); }

  $('f-cliente').onchange = e => { cliente = e.target.value; history.replaceState(null, '', '?cliente=' + encodeURIComponent(cliente)); renderConexao(); renderAcoes(); renderMetricas().catch(e => console.warn(e)); };
  render();
  recarregar();
  // a análise chega pelo banco: confere a cada 20 s enquanto estiver na fila
  setInterval(async () => {
    const r = DB.get('ig_relatorios', relId());
    if (document.hidden || !r || !/na_fila|analisando/.test(r.status)) return;
    if (await DB.reload(['ig_relatorios'])) renderAnalise();
  }, 20000);
</script>
</body>
</html>
