<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0809">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Plassô | CRM</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/ui.css?v=4">
<style>
  #board { display: none; }
  @media (min-width: 900px) { #board { display: grid; } #mobile-pipe { display: none; } }
</style>
</head>
<body data-theme="crm">
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="brand-mark">P</div><div><div class="brand-name">CRM</div><div class="brand-sub">Vendas</div></div></div>
    <div class="row"><button class="chip-btn" onclick="UI.menu()" aria-label="Menu"><i class="fa-solid fa-ellipsis"></i></button></div>
  </header>

  <div class="row-between" style="align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:20px">
    <div>
      <div class="eyebrow" id="resumo"></div>
      <h1 class="display mt-2">Pipeline<br><span class="soft">de vendas</span></h1>
    </div>
    <div class="pair">
      <button class="btn btn-white" onclick="novoLead()">Novo lead</button>
      <button class="chip-btn accent" style="width:46px;height:46px" onclick="novoLead()" aria-label="Novo lead"><i class="fa-solid fa-plus"></i></button>
    </div>
  </div>

  <div class="grid g-2 lg-g-4 mb-4" id="kpis"></div>

  <div class="row mb-3" style="flex-wrap:wrap">
    <div class="seg" id="vista" style="flex:0 0 auto"><button data-v="pipe" class="on">Pipeline</button><button data-v="ganhos">Ganhos</button><button data-v="perdidos">Perdidos</button></div>
    <div class="grow" style="position:relative;min-width:200px">
      <i class="fa-solid fa-magnifying-glass muted" style="position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:13px"></i>
      <input class="input" id="busca" placeholder="Buscar lead…" style="padding-left:40px">
    </div>
  </div>

  <section id="v-pipe">
    <div id="mobile-pipe">
      <div class="seg mb-3" id="etapas"></div>
      <div id="lista" class="stack"></div>
    </div>
    <div class="board" id="board" style="--cols:5"></div>
  </section>
  <section id="v-ganhos" class="hidden"><div class="grid md-g-2 lg-g-3" id="ganhos"></div></section>
  <section id="v-perdidos" class="hidden"><div class="grid md-g-2 lg-g-3" id="perdidos"></div></section>
</div>

<script src="assets/config.js?v=4"></script>
<script src="assets/core.js?v=5" data-mode="app"></script>
<script src="assets/ui.js?v=4"></script>
<script src="assets/integracao.js?v=4"></script>
<script type="text/plain" data-app>
  UI.mount({ tab: 'crm' });
  const { esc, T } = UI;
  const $ = id => document.getElementById(id);
  const ETAPAS = [
    { id: 'novolead', label: 'Novo lead', icon: 'fa-seedling' },
    { id: 'relacionamento', label: 'Relacionamento', icon: 'fa-comments' },
    { id: 'follow', label: 'Follow-up', icon: 'fa-phone' },
    { id: 'reuniao', label: 'Reunião', icon: 'fa-handshake' },
    { id: 'aguardando', label: 'Proposta', icon: 'fa-file-signature' }
  ];
  const etapaLabel = id => (ETAPAS.find(e => e.id === id) || { label: id }).label;
  let etapa = 'novolead', busca = '', vista = 'pipe';

  const leads = () => DB.list('crm').filter(l => !busca || (l.name + ' ' + (l.insta || '') + ' ' + (l.area || '')).toLowerCase().includes(busca));
  const hist = (l, txt) => { l.historyArray = l.historyArray || []; l.historyArray.push(`${new Date().toLocaleDateString('pt-BR')} — ${txt}`); };
  const proxAcao = l => {
    const ts = DB.list('tasks').filter(t => ['reuniao', 'follow'].includes(T.kind(t)) && (t.client || '').toLowerCase() === l.name.toLowerCase() && t.date >= UI.hoje()).sort((a, b) => (a.date + T.hora(a)).localeCompare(b.date + T.hora(b)));
    return ts[0] || null;
  };

  function renderKpis() {
    const all = DB.list('crm');
    const valor = all.reduce((a, l) => a + (Number(l.valor) || 0), 0);
    const reunioes = DB.list('tasks').filter(t => T.kind(t) === 'reuniao' && t.date >= UI.hoje()).length;
    const mes = UI.hoje().slice(0, 7);
    const ganhosMes = DB.list('crm_ganhos').filter(g => (g.ganhoEm || '').startsWith(mes));
    const ganhosTot = DB.list('crm_ganhos').length, perdTot = DB.list('crm_perdidos').length;
    const conv = ganhosTot + perdTot ? Math.round(ganhosTot * 100 / (ganhosTot + perdTot)) : null;
    const k = (icon, l, v, h) => `<div class="card stat"><span class="label"><i class="fa-solid ${icon} accent-text"></i>${l}</span><span class="value">${v}</span><span class="hint">${h}</span></div>`;
    $('kpis').innerHTML = k('fa-users', 'Leads ativos', all.length, 'no pipeline') + k('fa-sack-dollar', 'Em negociação', UI.brl(valor).replace(',00', ''), 'valor mensal estimado') + k('fa-handshake', 'Reuniões', reunioes, 'agendadas') + k('fa-trophy', 'Fechados', ganhosMes.length, conv != null ? `no mês · ${conv}% de conversão` : 'no mês');
    $('resumo').textContent = `${all.length} lead${all.length !== 1 ? 's' : ''} em andamento`;
  }

  function leadCard(l) {
    const p = proxAcao(l);
    return `<button class="card card-tight card-link" data-lead="${esc(l.id)}" style="text-align:left;width:100%" draggable="true">
      <div class="row-between" style="align-items:flex-start"><div style="min-width:0"><div class="title truncate" style="font-weight:500">${esc(l.name)}</div><div class="small muted truncate">${esc([l.insta, l.area].filter(Boolean).join(' · ') || 'sem detalhes')}</div></div>
        ${l.valor ? `<span class="pill num" style="flex-shrink:0">${UI.brl(l.valor).replace(',00', '')}</span>` : ''}</div>
      ${p ? `<div class="small mt-2" style="color:var(--accent-2)"><i class="fa-solid ${T.kindInfo(T.kind(p)).icon}"></i> ${T.kindInfo(T.kind(p)).label} ${UI.quando(p.date)}${T.hora(p) ? ' às ' + T.hora(p) : ''}</div>` : ''}
    </button>`;
  }

  function renderPipe() {
    const all = leads();
    $('etapas').innerHTML = ETAPAS.map(e => `<button data-e="${e.id}" class="${e.id === etapa ? 'on' : ''}"><i class="fa-solid ${e.icon}"></i>${e.label}<span class="count">${all.filter(l => (l.col || 'novolead') === e.id).length}</span></button>`).join('');
    $('etapas').querySelectorAll('button').forEach(b => b.onclick = () => { etapa = b.dataset.e; renderPipe(); });
    const doEt = all.filter(l => (l.col || 'novolead') === etapa);
    $('lista').innerHTML = doEt.map(leadCard).join('') || `<div class="card empty"><i class="fa-solid fa-bullseye"></i>Nenhum lead em ${etapaLabel(etapa)}.<br><button class="btn btn-white btn-sm mt-3" onclick="novoLead()">Novo lead</button></div>`;
    $('board').innerHTML = ETAPAS.map(e => {
      const arr = all.filter(l => (l.col || 'novolead') === e.id);
      return `<div class="col"><div class="col-head"><span class="h3">${e.label}</span><span class="pill">${arr.length}</span></div>
        <div class="col-drop" data-col="${e.id}">${arr.map(leadCard).join('') || '<div class="muted small center" style="padding:18px 6px">Arraste para cá</div>'}</div></div>`;
    }).join('');
    $('board').querySelectorAll('[draggable]').forEach(c => c.addEventListener('dragstart', ev => ev.dataTransfer.setData('text/plain', c.dataset.lead)));
    $('board').querySelectorAll('.col-drop').forEach(z => {
      z.addEventListener('dragover', ev => { ev.preventDefault(); z.classList.add('over'); });
      z.addEventListener('dragleave', () => z.classList.remove('over'));
      z.addEventListener('drop', ev => { ev.preventDefault(); z.classList.remove('over'); const id = ev.dataTransfer.getData('text/plain'); if (id) moverEtapa(id, z.dataset.col); });
    });
    document.querySelectorAll('[data-lead]').forEach(b => b.onclick = () => abrirLead(b.dataset.lead));
  }

  function renderFechados() {
    const g = DB.list('crm_ganhos').sort((a, b) => (b.ganhoEm || '').localeCompare(a.ganhoEm || ''));
    $('ganhos').innerHTML = g.map(l => `<div class="card"><div class="row-between"><div style="min-width:0"><div class="h3 truncate">${esc(l.name)}</div><div class="small muted">Fechado em ${UI.dataBR((l.ganhoEm || '').slice(0, 10))}</div></div><i class="fa-solid fa-trophy accent-text"></i></div></div>`).join('') || '<div class="card empty md-span-2">Nenhum contrato fechado ainda.</div>';
    const p = DB.list('crm_perdidos').sort((a, b) => (b.perdidoEm || '').localeCompare(a.perdidoEm || ''));
    $('perdidos').innerHTML = p.map(l => `<div class="card"><div class="row-between"><div style="min-width:0"><div class="h3 truncate">${esc(l.name)}</div><div class="small muted">${esc(l.motivo || 'sem motivo')} · ${UI.dataBR((l.perdidoEm || '').slice(0, 10))}</div></div><button class="btn btn-ghost btn-sm" data-reabrir="${esc(l.id)}">Reabrir</button></div></div>`).join('') || '<div class="card empty md-span-2">Nenhum lead perdido.</div>';
    $('perdidos').querySelectorAll('[data-reabrir]').forEach(b => b.onclick = () => { const l = DB.get('crm_perdidos', b.dataset.reabrir); DB.remove('crm_perdidos', l.id); delete l.motivo; delete l.perdidoEm; l.col = 'novolead'; hist(l, 'Lead reaberto'); DB.put('crm', l); render(); App.toast('Lead reaberto.', 'ok'); });
  }

  // ---------- ações ----------
  function moverEtapa(id, col) {
    const l = DB.get('crm', id); if (!l || l.col === col) return;
    if (col === 'follow') return agendar(l, 'follow');
    if (col === 'reuniao') return agendar(l, 'reuniao');
    l.col = col; hist(l, 'Movido para ' + etapaLabel(col)); DB.put('crm', l); render();
    App.toast(`${l.name} → ${etapaLabel(col)}`, 'ok');
  }

  function agendar(l, tipo, depois) {
    const padrao = tipo === 'follow' ? UI.addDias(UI.hoje(), 5) : UI.hoje();
    const s = UI.sheet({
      title: tipo === 'follow' ? 'Agendar follow-up' : 'Agendar reunião',
      html: `<p class="small soft">${esc(l.name)} vai para <b>${tipo === 'follow' ? 'Follow-up' : 'Reunião'}</b> e o compromisso aparece no Calendário, na Home e no Modo Trabalho.</p>
        <div class="form-grid mt-3">
          <label class="field"><span>Data</span><input class="input" type="date" id="d" value="${padrao}"></label>
          <label class="field"><span>Hora</span><input class="input" type="time" id="h" value="${tipo === 'follow' ? '09:00' : '10:00'}"></label>
          <label class="field full"><span>Anotação (opcional)</span><input class="input" id="n" placeholder="${tipo === 'follow' ? 'Ex.: mandar proposta revisada' : 'Ex.: Google Meet / endereço'}"></label>
        </div>`,
      foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-white" id="ok">Agendar</button>'
    });
    s.$('#ok').onclick = () => {
      const d = s.$('#d').value, h = s.$('#h').value, n = s.$('#n').value.trim();
      if (!d) { App.toast('Escolha a data.', 'warn'); return; }
      DB.put('tasks', { id: T.novoId(), kind: tipo, client: l.name, headline: (tipo === 'follow' ? 'Follow-up com ' : 'Reunião com ') + l.name, date: d, time: h, caption: h ? `Agendado às ${h}` : '', descricao: n, observacoes: n, notes: tipo === 'follow' ? 'crm_follow' : 'crm_meeting', type: 'Evento', status: 'afazer', isRejected: false, leadId: l.id });
      const atual = DB.get('crm', l.id);
      atual.col = tipo; atual.date = d; hist(atual, `${tipo === 'follow' ? 'Follow-up' : 'Reunião'} agendado para ${UI.dataBR(d)}${h ? ' às ' + h : ''}`);
      DB.put('crm', atual);
      s.close(); render(); App.toast(`${tipo === 'follow' ? 'Follow-up' : 'Reunião'} agendado e no calendário.`, 'ok');
      depois && depois();
    };
  }

  function fecharContrato(l, depois) {
    Integracao.abrirConversao(l, r => {
      const atual = DB.get('crm', l.id) || l;
      hist(atual, 'Fechou contrato');
      DB.put('crm_ganhos', { ...atual, col: 'ganho', ganhoEm: new Date().toISOString(), clienteId: r.client.id });
      DB.remove('crm', l.id);
      render(); depois && depois();
    });
  }

  function perdido(l, depois) {
    const s = UI.sheet({ title: 'Marcar como perdido', html: `<label class="field"><span>Motivo</span><select class="select" id="m"><option>Preço</option><option>Sem resposta</option><option>Fechou com outro</option><option>Sem orçamento agora</option><option>Não era o perfil</option><option>Outro</option></select></label>`, foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-danger" id="ok">Marcar perdido</button>' });
    s.$('#ok').onclick = () => { const atual = DB.get('crm', l.id); hist(atual, 'Perdido: ' + s.$('#m').value); DB.put('crm_perdidos', { ...atual, motivo: s.$('#m').value, perdidoEm: new Date().toISOString() }); DB.remove('crm', l.id); s.close(); render(); App.toast('Lead movido para Perdidos.', 'ok'); depois && depois(); };
  }

  function camposLead(l) {
    return `<div class="form-grid">
      <label class="field full"><span>Nome / empresa</span><input class="input" name="name" value="${esc(l.name || '')}" required></label>
      <label class="field"><span>Instagram</span><input class="input" name="insta" value="${esc(l.insta || '')}" placeholder="@perfil"></label>
      <label class="field"><span>WhatsApp</span><input class="input" name="telefone" inputmode="tel" value="${esc(l.telefone || '')}" placeholder="(11) 99999-9999"></label>
      <label class="field"><span>Segmento</span><input class="input" name="area" value="${esc(l.area || '')}" placeholder="Ex.: estética, restaurante"></label>
      <label class="field"><span>Valor estimado (R$/mês)</span><input class="input" type="number" step="0.01" inputmode="decimal" name="valor" value="${esc(l.valor ?? '')}"></label>
      <label class="field"><span>Origem</span><input class="input" name="origem" value="${esc(l.origem || '')}" placeholder="Indicação, Instagram…"></label>
      <label class="field"><span>E-mail</span><input class="input" type="email" name="email" value="${esc(l.email || '')}"></label>
      <label class="field full"><span>Link</span><input class="input" name="link" value="${esc(l.link || '')}" placeholder="site, perfil, proposta…"></label>
      <label class="field full"><span>Notas</span><textarea class="textarea" name="notas" rows="3">${esc(l.notas || '')}</textarea></label>
    </div>`;
  }
  const lerCampos = (el, l) => { const f = UI.formData(el); Object.assign(l, { name: f.name.trim(), insta: f.insta.trim(), telefone: f.telefone.trim(), area: f.area.trim(), valor: Number(f.valor) || 0, origem: f.origem.trim(), email: f.email.trim(), link: f.link.trim(), notas: f.notas }); return l; };

  function novoLead() {
    const s = UI.sheet({ title: 'Novo lead', html: camposLead({}), foot: '<button class="btn btn-ghost" data-close>Cancelar</button><button class="btn btn-white" id="ok">Criar lead</button>' });
    s.$('#ok').onclick = () => {
      const l = lerCampos(s.el, { id: 'l_' + Date.now().toString(36), col: 'novolead', historyArray: [] });
      if (!l.name) { App.toast('Informe o nome.', 'warn'); return; }
      hist(l, 'Lead criado'); DB.put('crm', l); s.close(); etapa = 'novolead'; render(); App.toast('Lead criado.', 'ok');
    };
  }

  function abrirLead(id) {
    const l = DB.get('crm', id); if (!l) return;
    const fone = String(l.telefone || '').replace(/\D/g, '');
    const s = UI.sheet({
      title: esc(l.name), wide: true,
      html: `
        <div class="eyebrow mb-2">Etapa</div>
        <div class="seg mb-4" data-etapas>${ETAPAS.map(e => `<button type="button" data-e="${e.id}" class="${(l.col || 'novolead') === e.id ? 'on' : ''}">${e.label}</button>`).join('')}</div>
        <div class="grid g-2 md-g-4 mb-4">
          <button class="btn btn-ghost btn-sm" data-a="follow"><i class="fa-solid fa-phone"></i> Follow-up</button>
          <button class="btn btn-ghost btn-sm" data-a="reuniao"><i class="fa-solid fa-handshake"></i> Reunião</button>
          ${fone ? `<a class="btn btn-ghost btn-sm" href="https://wa.me/${fone.length <= 11 ? '55' + fone : fone}" target="_blank" rel="noopener"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>` : `<button class="btn btn-ghost btn-sm" disabled><i class="fa-brands fa-whatsapp"></i> WhatsApp</button>`}
          ${l.insta ? `<a class="btn btn-ghost btn-sm" href="https://instagram.com/${esc(String(l.insta).replace(/^@/, ''))}" target="_blank" rel="noopener"><i class="fa-brands fa-instagram"></i> Instagram</a>` : `<button class="btn btn-ghost btn-sm" disabled><i class="fa-brands fa-instagram"></i> Instagram</button>`}
        </div>
        <button class="btn btn-accent btn-lg btn-block mb-4" data-a="fechar"><i class="fa-solid fa-trophy"></i> Fechou contrato</button>
        ${camposLead(l)}
        <div class="divider"></div>
        <div class="eyebrow mb-2">Histórico</div>
        <div class="list">${(l.historyArray || []).slice().reverse().map(h => `<div class="item" style="min-height:40px;padding:8px 0"><span class="small soft">${esc(h)}</span></div>`).join('') || '<div class="muted small">Sem histórico.</div>'}</div>
        <div class="row mt-3"><input class="input grow" id="nota" placeholder="Adicionar ao histórico…"><button class="btn btn-ghost" id="add-nota">Adicionar</button></div>
        <div class="row mt-4" style="flex-wrap:wrap"><button class="btn btn-ghost btn-sm" data-a="perdido"><i class="fa-solid fa-xmark"></i> Marcar como perdido</button><button class="btn btn-danger btn-sm" data-a="excluir"><i class="fa-solid fa-trash"></i> Excluir</button></div>`,
      foot: '<button class="btn btn-ghost" data-close>Fechar</button><button class="btn btn-white" data-save>Salvar</button>'
    });
    const salvar = (silencioso) => { const atual = DB.get('crm', id); if (!atual) return; lerCampos(s.el, atual); if (!atual.name) { App.toast('Informe o nome.', 'warn'); return false; } DB.put('crm', atual); if (!silencioso) App.toast('Lead salvo.', 'ok'); return true; };
    s.$('[data-save]').onclick = () => { if (salvar()) { s.close(); render(); } };
    s.$$('[data-e]').forEach(b => b.onclick = () => { if (!salvar(true)) return; s.close(); moverEtapa(id, b.dataset.e); });
    s.$('[data-a="follow"]').onclick = () => { if (!salvar(true)) return; s.close(); agendar(DB.get('crm', id), 'follow'); };
    s.$('[data-a="reuniao"]').onclick = () => { if (!salvar(true)) return; s.close(); agendar(DB.get('crm', id), 'reuniao'); };
    s.$('[data-a="fechar"]').onclick = () => { if (!salvar(true)) return; s.close(); fecharContrato(DB.get('crm', id)); };
    s.$('[data-a="perdido"]').onclick = () => { if (!salvar(true)) return; s.close(); perdido(DB.get('crm', id)); };
    s.$('[data-a="excluir"]').onclick = () => { if (!confirm(`Excluir o lead "${l.name}"? Não dá para desfazer.`)) return; DB.remove('crm', id); s.close(); render(); App.toast('Lead excluído.', 'ok'); };
    s.$('#add-nota').onclick = () => { const v = s.$('#nota').value.trim(); if (!v) return; salvar(true); const atual = DB.get('crm', id); hist(atual, v); DB.put('crm', atual); s.close(); render(); abrirLead(id); };
  }

  document.querySelectorAll('#vista button').forEach(b => b.onclick = () => { vista = b.dataset.v; document.querySelectorAll('#vista button').forEach(x => x.classList.toggle('on', x === b)); ['pipe', 'ganhos', 'perdidos'].forEach(v => $('v-' + v).classList.toggle('hidden', v !== vista)); });
  $('busca').addEventListener('input', e => { busca = e.target.value.toLowerCase().trim(); render(); });
  function render() { renderKpis(); renderPipe(); renderFechados(); }
  render();
  const qp = new URLSearchParams(location.search);
  if (qp.get('l')) abrirLead(qp.get('l'));
  if (qp.get('novo')) novoLead();
</script>
</body>
</html>
