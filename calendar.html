<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060918">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Plassô | Calendário</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/ui.css?v=12">
<link rel="icon" href="assets/icons/favicon-empresa.svg" type="image/svg+xml">
<link rel="icon" href="assets/icons/favicon-empresa-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-empresa.png">
<style>
  .cal .day .mini[data-mover] { cursor: grab; }
  [data-mover] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .cal .day.drop { outline: 2px dashed var(--accent); outline-offset: 2px; background: color-mix(in srgb, var(--accent) 18%, transparent); }
  body.arrastando, body.arrastando * { cursor: grabbing !important; }
  .arraste-fantasma { position: fixed; left: 0; top: 0; z-index: 9999; pointer-events: none; max-width: 220px; padding: 8px 12px; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
</style>
</head>
<body data-theme="empresa">
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="brand-mark">P</div><div><div class="brand-name">Empresa</div><div class="brand-sub">Calendário</div></div></div>
    <div class="row"><button class="chip-btn" onclick="UI.menu()" aria-label="Menu"><i class="fa-solid fa-ellipsis"></i></button></div>
  </header>
  <nav id="subnav"></nav>

  <div class="row-between" style="align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:18px">
    <div>
      <div class="eyebrow">Calendário</div>
      <h1 class="h1 mt-2" id="mes-nome" style="font-size:clamp(30px,8vw,48px)"></h1>
    </div>
    <div class="row">
      <button class="btn btn-ghost btn-sm" onclick="UI.agenda.configurar(() => UI.agenda.carregar(true).then(render))" id="btn-agenda"><i class="fa-brands fa-google"></i> <span id="agenda-txt">Conectar agenda</span></button>
      <button class="chip-btn" onclick="mudaMes(-1)" aria-label="Mês anterior"><i class="fa-solid fa-chevron-left"></i></button>
      <button class="btn btn-ghost btn-sm" onclick="irHoje()">Hoje</button>
      <button class="chip-btn" onclick="mudaMes(1)" aria-label="Próximo mês"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </div>

  <div class="seg mb-4" id="filtro">
    <button data-f="tudo" class="on">Tudo</button>
    <button data-f="post"><i class="fa-solid fa-clapperboard"></i>Conteúdos</button>
    <button data-f="comp"><i class="fa-solid fa-handshake"></i>Compromissos</button>
    <button data-f="google"><i class="fa-brands fa-google"></i>Agenda Google</button>
  </div>

  <div class="grid lg-g-main" style="align-items:start">
    <div class="card card-lg" style="padding:14px">
      <div class="cal" id="cal"></div>
    </div>
    <div class="card card-lg">
      <div class="card-head">
        <div><div class="eyebrow" id="dia-sem"></div><h2 class="h2 mt-1" id="dia-titulo"></h2></div>
        <button class="chip-btn accent" onclick="Empresa.novoNoDia(sel, render)" aria-label="Adicionar neste dia"><i class="fa-solid fa-plus"></i></button>
      </div>
      <div id="dia-lista" class="list"></div>
    </div>
  </div>
</div>

<script src="assets/config.js?v=10"></script>
<script src="assets/core.js?v=13" data-mode="app"></script>
<script src="assets/ui.js?v=14"></script>
<script src="assets/empresa.js?v=17"></script>
<script type="text/plain" data-app>
  UI.mount({ tab: 'empresa', sub: 'calendario' });
  const { esc, T } = UI;
  const $ = id => document.getElementById(id);
  let sel = UI.hoje();
  let ref = sel.slice(0, 7);
  let filtro = 'tudo';

  const itens = () => T.itensCalendario().filter(i => filtro === 'tudo' || (filtro === 'post' ? i._kind === 'post' : filtro === 'google' ? i._kind === 'google' : i._kind !== 'post' && i._kind !== 'google'));

  function mudaMes(n) { const [y, m] = ref.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); ref = d.toLocaleDateString('sv-SE').slice(0, 7); render(); }
  function irHoje() { sel = UI.hoje(); ref = sel.slice(0, 7); render(); }

  function renderCal() {
    $('mes-nome').textContent = UI.mesNome(ref);
    const [y, m] = ref.split('-').map(Number);
    const first = new Date(y, m - 1, 1);
    const start = new Date(first); start.setDate(1 - first.getDay());
    const all = itens();
    const hoje = UI.hoje();
    let html = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'].map(d => `<div class="dow">${d}</div>`).join('');
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const iso = d.toLocaleDateString('sv-SE');
      if (i >= 35 && iso.slice(0, 7) !== ref) break;
      const doDia = all.filter(x => x.date === iso).sort((a, b) => (a._hora || '99').localeCompare(b._hora || '99'));
      html += `<button class="day ${iso.slice(0, 7) !== ref ? 'out' : ''} ${iso === hoje ? 'today' : ''} ${iso === sel ? 'sel' : ''}" data-d="${iso}" aria-label="${UI.dataBR(iso)}, ${doDia.length} itens">
        <span class="n">${d.getDate()}</span>
        <span class="dots">${doDia.slice(0, 4).map(() => '<i></i>').join('')}</span>
        ${doDia.slice(0, 3).map(x => `<span class="mini ${x._kind === 'google' ? 'gc' : x._kind !== 'post' ? 'ev' : ''}" ${x._src !== 'google' ? `data-mover="${esc(x.id)}" data-src="${x._src}"` : ''}>${x._hora ? x._hora + ' ' : ''}${esc(x._titulo)}</span>`).join('')}${doDia.length > 3 ? `<span class="mini" style="background:none;color:var(--ink-3)">+${doDia.length - 3}</span>` : ''}
      </button>`;
    }
    $('cal').innerHTML = html;
    $('cal').querySelectorAll('[data-d]').forEach(b => {
      b.onclick = () => { if (ignorarClique) return; sel = b.dataset.d; if (sel.slice(0, 7) !== ref) ref = sel.slice(0, 7); render(); if (window.innerWidth < 1100) $('dia-titulo').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
      b.ondblclick = () => Empresa.novoNoDia(b.dataset.d, render);
    });
    $('cal').querySelectorAll('[data-mover]').forEach(ligarArraste);
  }

  function renderDia() {
    $('dia-sem').textContent = new Date(sel + 'T12:00').toLocaleDateString('pt-BR', { weekday: 'long' });
    $('dia-titulo').textContent = new Date(sel + 'T12:00').toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' });
    const arr = itens().filter(x => x.date === sel).sort((a, b) => (a._kind === 'post') - (b._kind === 'post') || (a._hora || '99').localeCompare(b._hora || '99'));
    $('dia-lista').innerHTML = arr.map(x => {
      const k = T.kindInfo(x._kind);
      const st = x._kind === 'post' ? T.statusInfo(T.status(x)) : null;
      return `<button class="item item-btn" data-open="${esc(x.id)}" data-src="${x._src}" ${x._src !== 'google' ? `data-mover="${esc(x.id)}"` : ''}>
        <div class="icon ${x._kind !== 'post' ? 'accent' : ''}"><i class="fa-solid ${k.icon}"></i></div>
        <div class="grow"><div class="title truncate">${esc(x._titulo)}</div><div class="sub truncate">${x._kind === 'post' ? esc([x.client, x.type].filter(Boolean).join(' · ')) : k.label + (x.client ? ' · ' + esc(x.client) : '')}</div></div>
        ${st ? `<span class="pill ${st.pill}">${st.label}</span>` : `<span class="pill num">${x._hora || 'dia todo'}</span>`}
      </button>`;
    }).join('') || `<div class="empty"><i class="fa-regular fa-calendar"></i>Nada neste dia.<br><button class="btn btn-white btn-sm mt-3" onclick="Empresa.novoNoDia(sel, render)">Adicionar</button></div>`;
    $('dia-lista').querySelectorAll('[data-open]').forEach(b => b.onclick = () => { if (!ignorarClique) Empresa.abrir(b.dataset.open, render, b.dataset.src); });
    $('dia-lista').querySelectorAll('[data-mover]').forEach(ligarArraste);
  }

  // ---------- arrastar um card para outro dia (muda a data) ----------
  // Mouse: arraste o card. Toque: segure meio segundo e arraste até o dia.
  let arraste = null, ignorarClique = false, rolagem = null;
  function ligarArraste(el) {
    // mouse (computador)
    el.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse' || e.button !== 0) return;
      arraste = { el, id: el.dataset.mover, src: el.dataset.src, x: e.clientX, y: e.clientY, ativo: false, alvo: null };
    });
    // toque (iPhone/iPad/Android): segure meio segundo e arraste
    el.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      const t = e.touches[0];
      arraste = { el, id: el.dataset.mover, src: el.dataset.src, x: t.clientX, y: t.clientY, ativo: false, alvo: null, toque: true };
      arraste.timer = setTimeout(() => ativar(arraste.x, arraste.y), 450);
    }, { passive: true });
    el.addEventListener('touchmove', e => {
      const a = arraste; if (!a || !a.toque) return;
      const t = e.touches[0];
      if (!a.ativo) {
        if (Math.hypot(t.clientX - a.x, t.clientY - a.y) > 10) { clearTimeout(a.timer); arraste = null; }   // era rolagem
        return;
      }
      e.preventDefault();                 // segura a tela parada enquanto arrasta
      mover(t.clientX, t.clientY);
    }, { passive: false });
    el.addEventListener('touchend', e => { if (arraste && arraste.toque) { if (arraste.ativo) e.preventDefault(); soltar(); } });
    el.addEventListener('touchcancel', () => { if (arraste && arraste.toque) soltar(); });
  }
  function ativar(x, y) {
    if (!arraste || arraste.ativo) return;
    arraste.ativo = true;
    const g = document.createElement('div');
    g.className = 'arraste-fantasma';
    g.textContent = (arraste.el.querySelector('.title') || arraste.el).textContent.trim();
    document.body.appendChild(g);
    arraste.fantasma = g;
    document.body.classList.add('arrastando');
    if (navigator.vibrate) try { navigator.vibrate(15); } catch (e) {}
    mover(x, y);
  }
  function mover(x, y) {
    const a = arraste; if (!a || !a.ativo) return;
    a.fantasma.style.transform = `translate(${x + 12}px, ${y + 12}px)`;
    a.ultY = y;
    const dia = document.elementFromPoint(x, y)?.closest('.cal .day');
    if (a.alvo && a.alvo !== dia) a.alvo.classList.remove('drop');
    if (dia) dia.classList.add('drop');
    a.alvo = dia || null;
    if (!rolagem) rolagem = setInterval(() => {   // rola a tela perto das bordas (celular: a lista fica abaixo do calendário)
      if (!arraste || !arraste.ativo) { clearInterval(rolagem); rolagem = null; return; }
      const yy = arraste.ultY;
      if (yy < 90) window.scrollBy(0, -14); else if (yy > innerHeight - 90) window.scrollBy(0, 14);
    }, 16);
  }
  window.addEventListener('pointermove', e => {
    const a = arraste; if (!a || a.toque) return;
    if (!a.ativo) { if (Math.hypot(e.clientX - a.x, e.clientY - a.y) > 6) ativar(e.clientX, e.clientY); return; }
    e.preventDefault();
    mover(e.clientX, e.clientY);
  });
  function soltar() {
    const a = arraste; arraste = null;
    if (!a) return;
    clearTimeout(a.timer);
    if (!a.ativo) return;
    a.fantasma.remove();
    document.body.classList.remove('arrastando');
    if (a.alvo) a.alvo.classList.remove('drop');
    ignorarClique = true; setTimeout(() => { ignorarClique = false; }, 350);
    if (a.alvo && a.alvo.dataset.d) mudarData(a.id, a.src, a.alvo.dataset.d);
  }
  window.addEventListener('pointerup', e => { if (arraste && !arraste.toque) soltar(); });
  document.addEventListener('contextmenu', e => { if (arraste) e.preventDefault(); });

  function mudarData(id, src, iso) {
    const col = src === 'events' ? 'events' : 'tasks';
    const it = DB.get(col, id);
    if (!it || it.date === iso) return;
    if (it.ig && it.ig.status === 'agendado') { App.toast('Este conteúdo já está agendado no Instagram. Cancele o agendamento no card e agende de novo no dia certo.', 'warn'); return; }
    DB.put(col, { ...it, date: iso });
    sel = iso; ref = iso.slice(0, 7);
    render();
    App.toast(`Movido para ${UI.dataBR(iso)}.`, 'ok');
  }

  document.querySelectorAll('#filtro button').forEach(b => b.onclick = () => { filtro = b.dataset.f; document.querySelectorAll('#filtro button').forEach(x => x.classList.toggle('on', x === b)); render(); });
  function render() {
    renderCal(); renderDia();
    const cfg = DB.getValue('config_agenda', null);
    $('agenda-txt').textContent = cfg && cfg.url ? `Agenda conectada${UI.agenda.eventos.length ? ' · ' + UI.agenda.eventos.length : ''}` : 'Conectar agenda';
  }
  render();
  UI.agenda.carregar().then(() => { render(); if (UI.agenda.erro) App.toast('Agenda do Google: ' + UI.agenda.erro, 'warn'); });
</script>
</body>
</html>
