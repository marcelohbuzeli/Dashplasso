    <main class="flex-1 flex flex-col h-full min-w-0 overflow-hidden bg-dark-950 relative">
        <header class="h-20 border-b border-dark-800/60 px-8 flex items-center justify-between bg-dark-900/30 backdrop-blur-md shrink-0 w-full">
            <div>
                <h1 class="text-base font-bold text-white tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days text-blue-500 text-xs"></i> Calendário Operacional
                </h1>

            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 space-y-6">
            <div class="bg-dark-900 border border-dark-800 rounded-2xl p-6">
                <h3 class="text-sm font-bold text-white mb-4 uppercase tracking-wider">Espelhamento Notion Calendar</h3>
                <div id="calendar-view" class="grid grid-cols-7 gap-3 text-center"></div>
            </div>
        </div>
    </main>
</div>
<script>
    function renderCalendar() {
        const calView = document.getElementById('calendar-view');
        if(!calView) return;
        calView.innerHTML = '';
        ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].forEach(d => { calView.innerHTML += '<div class="text-xs font-bold text-slate-400 uppercase py-2">' + d + '</div>'; });
        let tasks = JSON.parse(localStorage.getItem('plasso_tasks') || '[]');
        for (let i = 1; i <= 31; i++) {
            const hasTask = tasks.some(t => t.date.endsWith('-' + (i < 10 ? '0' + i : i)));
            const bgClass = hasTask ? 'bg-blue-950/40 border-blue-500/50 text-blue-300 font-bold' : 'bg-dark-950 border-dark-800 text-slate-400';
            calView.innerHTML += `<div class="h-24 border ${bgClass} rounded-xl p-2 flex flex-col justify-between text-left"><span class="text-xs font-mono">${i}</span>${hasTask ? '<span class="text-[9px] bg-blue-600 text-white px-1.5 py-0.5 rounded font-mono truncate">Postagem</span>' : ''}</div>`;
        }
    }
    renderCalendar();
</script>
