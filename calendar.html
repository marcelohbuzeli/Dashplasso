<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário | Plassô</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#030712',
                            900: '#0b0f19',
                            850: '#111827',
                            800: '#1f2937'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
    </style>
</head>
<body class="bg-dark-950 text-slate-200 antialiased overflow-hidden selection:bg-blue-600 selection:text-white">
<div class="flex flex-row h-screen w-screen overflow-hidden">
    <aside id="sidebar" class="bg-dark-900 border-r border-dark-800 flex flex-col justify-between transition-all duration-300 w-64 z-30 overflow-hidden shrink-0 h-full">
        <div class="flex flex-col h-full">
            <div class="h-20 flex items-center justify-between px-4 border-b border-dark-800/60 shrink-0">
                <div class="flex items-center gap-3 overflow-hidden">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center font-bold text-white text-lg shadow-lg shrink-0 font-mono">P</div>
                    <div class="sidebar-text truncate flex flex-col">
                        <span class="font-bold text-base tracking-widest text-white uppercase font-sans">Plassô</span>
                        <span class="text-[9px] text-blue-400 font-mono tracking-wider">MARKETING</span>
                    </div>
                </div>
            </div>
            <nav class="p-3 space-y-1.5 font-medium text-xs flex-1 overflow-y-auto">
                <a href="index.html" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl shadow-md transition group text-left cursor-pointer text-slate-400 hover:text-slate-200 hover:bg-dark-800/40"><i class="fa-solid fa-chart-pie w-5 text-center text-sm shrink-0"></i><span class="sidebar-text tracking-wide whitespace-nowrap">Dashboard</span></a>
                <a href="tasks.html" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl shadow-md transition group text-left cursor-pointer text-slate-400 hover:text-slate-200 hover:bg-dark-800/40"><i class="fa-solid fa-terminal w-5 text-center text-sm shrink-0"></i><span class="sidebar-text tracking-wide whitespace-nowrap">Tasks</span></a>
                <a href="clients.html" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl shadow-md transition group text-left cursor-pointer text-slate-400 hover:text-slate-200 hover:bg-dark-800/40"><i class="fa-solid fa-network-wired w-5 text-center text-sm shrink-0"></i><span class="sidebar-text tracking-wide whitespace-nowrap">Clientes</span></a>
                <a href="calendar.html" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl shadow-md transition group text-left cursor-pointer bg-blue-600 text-white"><i class="fa-solid fa-calendar-days w-5 text-center text-sm shrink-0"></i><span class="sidebar-text tracking-wide whitespace-nowrap">Calendário</span></a>
                <a href="crm.html" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl shadow-md transition group text-left cursor-pointer text-slate-400 hover:text-slate-200 hover:bg-dark-800/40"><i class="fa-solid fa-users-viewfinder w-5 text-center text-sm shrink-0"></i><span class="sidebar-text tracking-wide whitespace-nowrap">CRM</span></a>
                <a href="finance.html" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-xl shadow-md transition group text-left cursor-pointer text-slate-400 hover:text-slate-200 hover:bg-dark-800/40"><i class="fa-solid fa-wallet w-5 text-center text-sm shrink-0"></i><span class="sidebar-text tracking-wide whitespace-nowrap">Financeiro</span></a>
            </nav>
    </aside>
    
    <main class="flex-1 flex flex-col h-full min-w-0 overflow-hidden bg-dark-950 relative">
        <header class="h-20 border-b border-dark-800/60 px-8 flex items-center justify-between bg-dark-900/30 backdrop-blur-md shrink-0 w-full">
            <div>
                <h1 class="text-base font-bold text-white tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-calendar-days text-blue-500 text-xs"></i> Calendário
                </h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="openNewEventModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl text-xs font-semibold flex items-center gap-2 shadow-lg transition cursor-pointer">
                    <i class="fa-solid fa-plus text-[10px]"></i> Nova Agenda
                </button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 space-y-6">
            <div class="bg-dark-900 border border-dark-800 rounded-2xl p-6 space-y-6">
                <div class="flex justify-between items-center flex-wrap gap-4">
                    <h3 id="calendar-title" class="text-sm font-bold text-white uppercase tracking-wider">Calendário Operacional</h3>
                    <div class="flex items-center gap-3">
                        <label class="text-xs text-slate-400 font-mono">Mês:</label>
                        <select id="cal-month-select" onchange="renderCalendar()" class="bg-dark-950 border border-dark-800 rounded-xl px-3 py-2 text-xs text-white font-mono cursor-pointer">
                            <option value="2026-01">Janeiro de 2026</option>
                            <option value="2026-02">Fevereiro de 2026</option>
                            <option value="2026-03">Março de 2026</option>
                            <option value="2026-04">Abril de 2026</option>
                            <option value="2026-05">Maio de 2026</option>
                            <option value="2026-06">Junho de 2026</option>
                            <option value="2026-07">Julho de 2026</option>
                            <option value="2026-08">Agosto de 2026</option>
                            <option value="2026-09">Setembro de 2026</option>
                            <option value="2026-10" selected>Outubro de 2026</option>
                            <option value="2026-11">Novembro de 2026</option>
                            <option value="2026-12">Dezembro de 2026</option>
                        </select>
                    </div>
                </div>

                <div id="calendar-view" class="grid grid-cols-7 gap-3 text-center"></div>
            </div>
        </div>
    </main>
</div>

<!-- Modal 1: Follow Up (Caixa Amarela) -->
<div id="modalFollow" class="fixed inset-0 bg-dark-950/85 backdrop-blur-md hidden items-center justify-center z-[9999] p-4">
    <div class="bg-dark-900 border border-amber-500/60 w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4 text-xs">
        <div class="flex justify-between items-center pb-3 border-b border-dark-800">
            <h3 class="text-base font-bold text-amber-400 uppercase"><i class="fa-solid fa-calendar-days mr-1"></i> Editar Follow Up</h3>
            <button onclick="closeModals()" class="text-slate-400 hover:text-white p-2 rounded-xl bg-dark-800 transition cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <input type="hidden" id="mf-id">
        <div><label class="block text-slate-400 mb-1">Nome do Cliente</label><input type="text" id="mf-client" disabled class="w-full bg-dark-950 border border-dark-800 rounded-xl px-3.5 py-2.5 text-slate-400 font-bold cursor-not-allowed"></div>
        <div><label class="block text-slate-400 mb-1">Data</label><input type="date" id="mf-date" class="w-full bg-dark-950 border border-dark-800 rounded-xl px-3.5 py-2.5 text-white font-mono"></div>
        <div>
            <label class="block text-slate-400 mb-1">Horário</label>
            <select id="mf-time" class="w-full bg-dark-950 border border-dark-800 rounded-xl px-3.5 py-2.5 text-white font-mono">
                <option value="09:00">09:00</option><option value="10:00">10:00</option><option value="11:00">11:00</option>
                <option value="14:00">14:00</option><option value="15:00">15:00</option><option value="16:00">16:00</option><option value="17:00">17:00</option>
            </select>
        </div>
        <div class="flex justify-between items-center pt-2">
            <button onclick="deleteEvent()" class="text-red-400 hover:text-red-300 font-semibold cursor-pointer"><i class="fa-solid fa-trash mr-1"></i> Apagar</button>
            <button onclick="saveFollowEvent()" class="bg-amber-600 hover:bg-amber-500 text-white px-5 py-2 rounded-xl font-semibold cursor-pointer">Salvar</button>
        </div>
    </div>
</div>

<!-- Modal 2: Reunião (Caixa Roxa) -->
<div id="modalMeeting" class="fixed inset-0 bg-dark-950/85 backdrop-blur-md hidden items-center justify-center z-[9999] p-4">
    <div class="bg-dark-900 border border-purple-500/60 w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4 text-xs">
        <div class="flex justify-between items-center pb-3 border-b border-dark-800">
            <h3 class="text-base font-bold text-purple-400 uppercase"><i class="fa-solid fa-handshake mr-1"></i> Editar Reunião</h3>
            <button onclick="closeModals()" class="text-slate-400 hover:text-white p-2 rounded-xl bg-dark-800 transition cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <input type="hidden" id="mm-id">
        <div><label class="block text-slate-400 mb-1">Nome do Cliente</label><input type="text" id="mm-client" disabled class="w-full bg-dark-950 border border-dark-800 rounded-xl px-3.5 py-2.5 text-slate-400 font-bold cursor-not-allowed"></div>
        <div><label class="block text-slate-400 mb-1">Data</label><input type="date" id="mm-date" class="w-full bg-dark-950 border border-dark-800 rounded-xl px-3.5 py-2.5 text-white font-mono"></div>
        <div><label class="block text-slate-400 mb-1">Horário</label><input type="time" id="mm-time" class="w-full bg-dark-950 border border-dark-800 rounded-xl px-3.5 py-2.5 text-white font-mono"></div>
        <div class="flex justify-between items-center pt-2">
            <button onclick="deleteEvent()" class="text-red-400 hover:text-red-300 font-semibold cursor-pointer"><i class="fa-solid fa-trash mr-1"></i> Apagar</button>
            <button onclick="saveMeetingEvent()" class="bg-purple-600 hover:bg-purple-500 text-white px-5 py-2 rounded-xl font-semibold cursor-pointer">Salvar</button>
        </div>
    </div>
</div>

<!-- Modal 3: Postagem (Caixa Azul) -->
<div id="modalPost" class="fixed inset-0 bg-dark-950/85 backdrop-blur-md hidden items-center justify-center z-[9999] p-4">
    <div class="bg-dark-900 border border-blue-500/60 w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-4 text-xs">
        <div class="flex justify-between items-center pb-3 border-b border-dark-800">
            <h3 class="text-base font-bold text-blue-400 uppercase"><i class="fa-solid fa-terminal mr-1"></i> Editar Postagem</h3>
            <button onclick="closeModals()" class="text-slate-400 hover:text-white p-2 rounded-xl bg-dark-800 transition cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <input type="hidden" id="mp-id">
        <div><label class="block text-slate-400 mb-1">Headline</label><input type="text" id="mp-headline" class="w-full bg-dark-950 border border-dark-800 rounded-xl px-3.5 py-2.5 text-white font-bold"></div>
        <div><label class="block text-slate-400 mb-1">Cliente</label><input type="text" id="mp-client" class="w-full bg-dark-950 border border-dark-800 rounded-xl px-3.5 py-2.5 text-white"></div>
        <div><label class="block text-slate-400 mb-1">Formato</label><select id="mp-type" class="w-full bg-dark-950 border border-dark-800 rounded-xl px-3.5 py-2.5 text-white"><option value="Reels">Reels</option><option value="Carrossel">Carrossel</option><option value="Story">Story</option><option value="Foto Única">Foto Única</option></select></div>
        <div><label class="block text-slate-400 mb-1">Data da Postagem</label><input type="date" id="mp-date" class="w-full bg-dark-950 border border-dark-800 rounded-xl px-3.5 py-2.5 text-white font-mono"></div>
        <div><label class="block text-slate-400 mb-1">Link do Drive</label><input type="url" id="mp-drive" class="w-full bg-dark-950 border border-dark-800 rounded-xl px-3.5 py-2.5 text-blue-400 font-mono"></div>
        <div><label class="block text-slate-400 mb-1">Legenda</label><textarea id="mp-caption" rows="3" class="w-full bg-dark-950 border border-dark-800 rounded-xl p-3 text-white resize-none"></textarea></div>
        <div><label class="block text-slate-400 mb-1">Notas / Observações</label><textarea id="mp-notes" rows="2" class="w-full bg-dark-950 border border-dark-800 rounded-xl p-3 text-amber-300 resize-none"></textarea></div>
        <div class="flex justify-between items-center pt-2">
            <button onclick="deleteEvent()" class="text-red-400 hover:text-red-300 font-semibold cursor-pointer"><i class="fa-solid fa-trash mr-1"></i> Apagar</button>
            <button onclick="savePostEvent()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl font-semibold cursor-pointer">Salvar</button>
        </div>
    </div>
</div>

<!-- Modal Nova Agenda -->
<div id="newEventModal" class="fixed inset-0 bg-dark-950/80 backdrop-blur-md hidden items-center justify-center z-50 p-4">
    <div class="bg-dark-900 border border-dark-800 w-full max-w-md rounded-2xl p-6 shadow-2xl">
        <form onsubmit="createNewEvent(event)" class="space-y-4 text-xs">
            <h3 class="text-sm font-bold text-white uppercase">Criar Nova Agenda / Evento</h3>
            <input type="text" id="ev-title" required class="w-full bg-dark-950 border border-dark-800 rounded-xl px-3.5 py-2.5 text-white" placeholder="Título / Nome">
            <select id="ev-type" class="w-full bg-dark-950 border border-dark-800 rounded-xl px-3.5 py-2.5 text-white">
                <option value="Post">Postagem / Task</option>
                <option value="Followup">Follow-up CRM</option>
                <option value="Reuniao">Reunião CRM</option>
            </select>
            <input type="date" id="ev-date" required class="w-full bg-dark-950 border border-dark-800 rounded-xl px-3.5 py-2.5 text-white font-mono">
            <div class="flex justify-end gap-3 pt-2">
                <button type="button" onclick="closeNewEventModal()" class="text-slate-400">Cancelar</button>
                <button type="submit" class="bg-blue-600 text-white px-5 py-2 rounded-xl font-semibold">Salvar na Agenda</button>
            </div>
        </form>
    </div>
</div>

<script>
    let activeEditingId = null;

    function renderCalendar() {
        const calView = document.getElementById('calendar-view');
        const selectedYearMonth = document.getElementById('cal-month-select').value;
        if(!calView) return;
        calView.innerHTML = '';
        
        ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].forEach(d => { calView.innerHTML += '<div class="text-xs font-bold text-slate-400 uppercase py-2">' + d + '</div>'; });
        
        let tasks = JSON.parse(localStorage.getItem('plasso_tasks') || '[]');

        for (let i = 1; i <= 31; i++) {
            let dayStr = i < 10 ? '0' + i : '' + i;
            let targetDateStr = selectedYearMonth + '-' + dayStr;

            let dayTasks = tasks.filter(t => t.date === targetDateStr);
            let hasAny = dayTasks.length > 0;

            let bgClass = 'bg-dark-950 border-dark-800 text-slate-500 opacity-40';
            let badgesHTML = '';

            if (hasAny) {
                bgClass = 'bg-dark-900 border-slate-700 text-white font-bold';
                dayTasks.forEach(dt => {
                    let titleText = dt.headline || dt.client || 'Post';
                    let tagColor = 'bg-blue-600 text-white'; // Azul para Postagens

                    if (dt.notes === 'crm_follow' || titleText.includes('Follow Up')) {
                        tagColor = 'bg-amber-400 text-slate-950 font-extrabold';
                    } else if (dt.notes === 'crm_meeting' || titleText.includes('Reunião')) {
                        tagColor = 'bg-purple-600 text-white font-bold';
                    }

                    badgesHTML += `<span onclick="event.stopPropagation(); openSmartModal('${dt.id}')" class="text-[9px] ${tagColor} px-1.5 py-0.5 rounded font-mono truncate block mt-1 cursor-pointer hover:opacity-80 transition" title="Clique para editar">${titleText}</span>`;
                });
            }

            calView.innerHTML += `<div class="h-32 border ${bgClass} rounded-xl p-2 flex flex-col justify-between text-left"><span class="text-xs font-mono">${i}</span><div class="overflow-y-auto max-h-20 space-y-1">${badgesHTML}</div></div>`;
        }
    }

    function openSmartModal(id) {
        let tasks = JSON.parse(localStorage.getItem('plasso_tasks') || '[]');
        let t = tasks.find(task => task.id === id);
        if(!t) return;
        activeEditingId = id;

        closeModals();

        if (t.notes === 'crm_follow' || (t.headline && t.headline.includes('Follow Up'))) {
            document.getElementById('mf-id').value = t.id;
            document.getElementById('mf-client').value = t.client || 'Cliente';
            document.getElementById('mf-date').value = t.date || '';
            document.getElementById('modalFollow').classList.remove('hidden');
            document.getElementById('modalFollow').classList.add('flex');
        } else if (t.notes === 'crm_meeting' || (t.headline && t.headline.includes('Reunião'))) {
            document.getElementById('mm-id').value = t.id;
            document.getElementById('mm-client').value = t.client || 'Cliente';
            document.getElementById('mm-date').value = t.date || '';
            // Tentar extrair horário se houver no formato [09h] ou similar
            document.getElementById('mm-time').value = '10:00';
            document.getElementById('modalMeeting').classList.remove('hidden');
            document.getElementById('modalMeeting').classList.add('flex');
        } else {
            document.getElementById('mp-id').value = t.id;
            document.getElementById('mp-headline').value = t.headline || '';
            document.getElementById('mp-client').value = t.client || '';
            document.getElementById('mp-type').value = t.type || 'Reels';
            document.getElementById('mp-date').value = t.date || '';
            document.getElementById('mp-drive').value = t.drive || '';
            document.getElementById('mp-caption').value = t.caption || '';
            document.getElementById('mp-notes').value = t.notes || '';
            document.getElementById('modalPost').classList.remove('hidden');
            document.getElementById('modalPost').classList.add('flex');
        }
    }

    function closeModals() {
        document.getElementById('modalFollow').classList.add('hidden'); document.getElementById('modalFollow').classList.remove('flex');
        document.getElementById('modalMeeting').classList.add('hidden'); document.getElementById('modalMeeting').classList.remove('flex');
        document.getElementById('modalPost').classList.add('hidden'); document.getElementById('modalPost').classList.remove('flex');
    }

    function saveFollowEvent() {
        let tasks = JSON.parse(localStorage.getItem('plasso_tasks') || '[]');
        let t = tasks.find(task => task.id === activeEditingId);
        if(t) {
            let newDate = document.getElementById('mf-date').value;
            let newTime = document.getElementById('mf-time').value;
            t.date = newDate;
            t.caption = `Follow-up agendado às ${newTime}`;
            localStorage.setItem('plasso_tasks', JSON.stringify(tasks));
            alert('Follow Up atualizado com sucesso!');
            closeModals();
            renderCalendar();
        }
    }

    function saveMeetingEvent() {
        let tasks = JSON.parse(localStorage.getItem('plasso_tasks') || '[]');
        let t = tasks.find(task => task.id === activeEditingId);
        if(t) {
            let newDate = document.getElementById('mm-date').value;
            let newTime = document.getElementById('mm-time').value;
            let hourFormatted = newTime.split(':')[0] + 'h';
            t.date = newDate;
            t.headline = `[${hourFormatted}] Reunião ${t.client}`;
            t.caption = `Reunião agendada às ${newTime}`;
            localStorage.setItem('plasso_tasks', JSON.stringify(tasks));
            alert('Reunião atualizada com sucesso!');
            closeModals();
            renderCalendar();
        }
    }

    function savePostEvent() {
        let tasks = JSON.parse(localStorage.getItem('plasso_tasks') || '[]');
        let t = tasks.find(task => task.id === activeEditingId);
        if(t) {
            t.headline = document.getElementById('mp-headline').value;
            t.client = document.getElementById('mp-client').value;
            t.type = document.getElementById('mp-type').value;
            t.date = document.getElementById('mp-date').value;
            t.drive = document.getElementById('mp-drive').value;
            t.caption = document.getElementById('mp-caption').value;
            t.notes = document.getElementById('mp-notes').value;
            localStorage.setItem('plasso_tasks', JSON.stringify(tasks));
            alert('Postagem atualizada com sucesso!');
            closeModals();
            renderCalendar();
        }
    }

    function deleteEvent() {
        if(!confirm('Deseja apagar este agendamento?')) return;
        let tasks = JSON.parse(localStorage.getItem('plasso_tasks') || '[]');
        tasks = tasks.filter(task => task.id !== activeEditingId);
        localStorage.setItem('plasso_tasks', JSON.stringify(tasks));
        closeModals();
        renderCalendar();
    }

    function openNewEventModal() { document.getElementById('newEventModal').classList.remove('hidden'); document.getElementById('newEventModal').classList.add('flex'); document.getElementById('ev-date').valueAsDate = new Date(); }
    function closeNewEventModal() { document.getElementById('newEventModal').classList.add('hidden'); document.getElementById('newEventModal').classList.remove('flex'); }
    function createNewEvent(e) {
        e.preventDefault();
        let title = document.getElementById('ev-title').value;
        let type = document.getElementById('ev-type').value;
        let date = document.getElementById('ev-date').value;

        let headlineText = title;
        let noteType = 'event';

        if(type === 'Followup') {
            headlineText = `Follow (${title})`;
            noteType = 'crm_follow';
        } else if(type === 'Reuniao') {
            headlineText = `[09h] Reunião ${title}`;
            noteType = 'crm_meeting';
        }

        let tasks = JSON.parse(localStorage.getItem('plasso_tasks') || '[]');
        tasks.push({ id: 't_' + Date.now(), client: title, headline: headlineText, type: 'Reels', caption: '', drive: '', date: date, status: 'todo', notes: noteType, isRejected: false });
        localStorage.setItem('plasso_tasks', JSON.stringify(tasks));

        closeNewEventModal();
        renderCalendar();
        alert('Agenda criada com sucesso!');
    }

    renderCalendar();
</script>
</body>
</html>
