<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060918">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Plassô | Calendário</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="assets/ui.css?v=6">
</head>
<body data-theme="empresa">
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="brand-mark">P</div><div><div class="brand-name">Empresa</div><div class="brand-sub">Calendário</div></div></div>
    <div class="row"><button class="chip-btn" onclick="UI.menu()" aria-label="Menu"><i class="fa-solid fa-ellipsis"></i></button></div>
  </header>
  <nav id="subnav"></nav>

  <div class="row-between" style="align-items:flex-end;flex-wrap:wrap;gap:14px;margin-bottom:18px">
    <div>
      <div class="eyebrow">Calendário</div>
      <h1 class="h1 mt-2" id="mes-nome" style="font-size:clamp(30px,8vw,48px)"></h1>
    </div>
    <div class="row">
      <button class="btn btn-ghost btn-sm" onclick="UI.agenda.configurar(() => UI.agenda.carregar(true).then(render))" id="btn-agenda"><i class="fa-brands fa-google"></i> <span id="agenda-txt">Conectar agenda</span></button>
      <button class="chip-btn" onclick="mudaMes(-1)" aria-label="Mês anterior"><i class="fa-solid fa-chevron-left"></i></button>
      <button class="btn btn-ghost btn-sm" onclick="irHoje()">Hoje</button>
      <button class="chip-btn" onclick="mudaMes(1)" aria-label="Próximo mês"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </div>

  <div class="seg mb-4" id="filtro">
    <button data-f="tudo" class="on">Tudo</button>
    <button data-f="post"><i class="fa-solid fa-clapperboard"></i>Conteúdos</button>
    <button data-f="comp"><i class="fa-solid fa-handshake"></i>Compromissos</button>
    <button data-f="google"><i class="fa-brands fa-google"></i>Agenda Google</button>
  </div>

  <div class="grid lg-g-main" style="align-items:start">
    <div class="card card-lg" style="padding:14px">
      <div class="cal" id="cal"></div>
    </div>
    <div class="card card-lg">
      <div class="card-head">
        <div><div class="eyebrow" id="dia-sem"></div><h2 class="h2 mt-1" id="dia-titulo"></h2></div>
        <button class="chip-btn accent" onclick="Empresa.novoNoDia(sel, render)" aria-label="Adicionar neste dia"><i class="fa-solid fa-plus"></i></button>
      </div>
      <div id="dia-lista" class="list"></div>
    </div>
  </div>
</div>

<script src="assets/config.js?v=6"></script>
<script src="assets/core.js?v=6" data-mode="app"></script>
<script src="assets/ui.js?v=6"></script>
<script src="assets/empresa.js?v=6"></script>
<script type="text/plain" data-app>
  UI.mount({ tab: 'empresa', sub: 'calendario' });
  const { esc, T } = UI;
  const $ = id => document.getElementById(id);
  let sel = UI.hoje();
  let ref = sel.slice(0, 7);
  let filtro = 'tudo';

  const itens = () => T.itensCalendario().filter(i => filtro === 'tudo' || (filtro === 'post' ? i._kind === 'post' : filtro === 'google' ? i._kind === 'google' : i._kind !== 'post' && i._kind !== 'google'));

  function mudaMes(n) { const [y, m] = ref.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); ref = d.toLocaleDateString('sv-SE').slice(0, 7); render(); }
  function irHoje() { sel = UI.hoje(); ref = sel.slice(0, 7); render(); }

  function renderCal() {
    $('mes-nome').textContent = UI.mesNome(ref);
    const [y, m] = ref.split('-').map(Number);
    const first = new Date(y, m - 1, 1);
    const start = new Date(first); start.setDate(1 - first.getDay());
    const all = itens();
    const hoje = UI.hoje();
    let html = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'].map(d => `<div class="dow">${d}</div>`).join('');
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const iso = d.toLocaleDateString('sv-SE');
      if (i >= 35 && iso.slice(0, 7) !== ref) break;
      const doDia = all.filter(x => x.date === iso).sort((a, b) => (a._hora || '99').localeCompare(b._hora || '99'));
      html += `<button class="day ${iso.slice(0, 7) !== ref ? 'out' : ''} ${iso === hoje ? 'today' : ''} ${iso === sel ? 'sel' : ''}" data-d="${iso}" aria-label="${UI.dataBR(iso)}, ${doDia.length} itens">
        <span class="n">${d.getDate()}</span>
        <span class="dots">${doDia.slice(0, 4).map(() => '<i></i>').join('')}</span>
        ${doDia.slice(0, 3).map(x => `<span class="mini ${x._kind === 'google' ? 'gc' : x._kind !== 'post' ? 'ev' : ''}">${x._hora ? x._hora + ' ' : ''}${esc(x._titulo)}</span>`).join('')}${doDia.length > 3 ? `<span class="mini" style="background:none;color:var(--ink-3)">+${doDia.length - 3}</span>` : ''}
      </button>`;
    }
    $('cal').innerHTML = html;
    $('cal').querySelectorAll('[data-d]').forEach(b => {
      b.onclick = () => { sel = b.dataset.d; if (sel.slice(0, 7) !== ref) ref = sel.slice(0, 7); render(); if (window.innerWidth < 1100) $('dia-titulo').scrollIntoView({ behavior: 'smooth', block: 'center' }); };
      b.ondblclick = () => Empresa.novoNoDia(b.dataset.d, render);
    });
  }

  function renderDia() {
    $('dia-sem').textContent = new Date(sel + 'T12:00').toLocaleDateString('pt-BR', { weekday: 'long' });
    $('dia-titulo').textContent = new Date(sel + 'T12:00').toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' });
    const arr = itens().filter(x => x.date === sel).sort((a, b) => (a._kind === 'post') - (b._kind === 'post') || (a._hora || '99').localeCompare(b._hora || '99'));
    $('dia-lista').innerHTML = arr.map(x => {
      const k = T.kindInfo(x._kind);
      const st = x._kind === 'post' ? T.statusInfo(T.status(x)) : null;
      return `<button class="item item-btn" data-open="${esc(x.id)}" data-src="${x._src}">
        <div class="icon ${x._kind !== 'post' ? 'accent' : ''}"><i class="fa-solid ${k.icon}"></i></div>
        <div class="grow"><div class="title truncate">${esc(x._titulo)}</div><div class="sub truncate">${x._kind === 'post' ? esc([x.client, x.type].filter(Boolean).join(' · ')) : k.label + (x.client ? ' · ' + esc(x.client) : '')}</div></div>
        ${st ? `<span class="pill ${st.pill}">${st.label}</span>` : `<span class="pill num">${x._hora || 'dia todo'}</span>`}
      </button>`;
    }).join('') || `<div class="empty"><i class="fa-regular fa-calendar"></i>Nada neste dia.<br><button class="btn btn-white btn-sm mt-3" onclick="Empresa.novoNoDia(sel, render)">Adicionar</button></div>`;
    $('dia-lista').querySelectorAll('[data-open]').forEach(b => b.onclick = () => Empresa.abrir(b.dataset.open, render, b.dataset.src));
  }

  document.querySelectorAll('#filtro button').forEach(b => b.onclick = () => { filtro = b.dataset.f; document.querySelectorAll('#filtro button').forEach(x => x.classList.toggle('on', x === b)); render(); });
  function render() {
    renderCal(); renderDia();
    const cfg = DB.getValue('config_agenda', null);
    $('agenda-txt').textContent = cfg && cfg.url ? `Agenda conectada${UI.agenda.eventos.length ? ' · ' + UI.agenda.eventos.length : ''}` : 'Conectar agenda';
  }
  render();
  UI.agenda.carregar().then(() => { render(); if (UI.agenda.erro) App.toast('Agenda do Google: ' + UI.agenda.erro, 'warn'); });
</script>
</body>
</html>
